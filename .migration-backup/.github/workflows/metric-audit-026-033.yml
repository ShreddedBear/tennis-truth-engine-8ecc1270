name: Metric Audit 026 029 031 032 033

on:
  push:
    branches:
      - audit/metrics-026-029-031-032-033
      - audit/postfix-wiring-026-033
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run protected metric regression tests
        run: bunx vitest run src/lib/metric-certification-026-033.test.ts src/lib/metric-exact-component-026-033.test.ts src/lib/metric-postfix-wiring-026-033.test.ts

      - name: Build app
        run: bun run build
