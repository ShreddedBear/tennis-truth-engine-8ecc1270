name: Pre-Task-19 Reconciliation Validation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pre-task19-reconciliation-validation.yml'
      - '.github/workflows/evidence-task18a-historical-results.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-task19-reconciliation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build four-tour repository evidence index
        run: node scripts/build-runtime-tennis-index.mjs
      - name: Task 17 recoverability audit
        run: bunx vitest run src/lib/metric-recoverability-map.test.ts
      - name: Task 18A historical/results regression
        run: bunx vitest run src/lib/historical-results-recovery.test.ts src/lib/deterministic-historical-results-metrics.test.ts
      - name: Task 18B PBP/score-state and firewall regression
        run: bunx vitest run src/lib/pbp-evidence-firewall.test.ts src/lib/pbp-score-state-recovery.test.ts
      - name: Task 18C ranking/form/workload regression
        run: bunx vitest run src/lib/deterministic-ranking-metrics.test.ts src/lib/task18c-rank-form-workload.test.ts src/lib/newly-green-end-to-end-coverage-audit.test.ts
      - name: Tasks 1-16 identity/match/evidence foundations
        run: bunx vitest run src/lib/evidence-player-alias.test.ts src/lib/evidence-match-identity.test.ts src/lib/persisted-evidence-alias-dedupe.test.ts src/lib/deterministic-results-schedule-metrics.test.ts
      - name: Shared source-family and false-green policy regression
        run: bunx vitest run src/lib/metric-source-family-policy.test.ts
      - name: Task 18B deterministic recovery audit
        run: bun scripts/task18b-pbp-recovery-audit.ts
      - name: Production build
        run: bun run build
