name: Sync TennisMyLife Challenger History

on:
  pull_request:
    paths:
      - "scripts/sync-tennismylife-challenger.py"
      - ".github/workflows/sync-tennismylife-challenger.yml"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync-tennismylife-challenger.py"
      - ".github/workflows/sync-tennismylife-challenger.yml"

permissions:
  contents: write

jobs:
  import-challenger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install importer dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Download, preserve, normalize and validate 2005-current Challenger files
        run: |
          set -euo pipefail
          python scripts/sync-tennismylife-challenger.py
      - name: Print exact yearly manifest
        run: cat data/public/tennismylife-challenger/IMPORT_MANIFEST.json
      - name: Validate accounting and duplicate safety
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('data/public/tennismylife-challenger/IMPORT_MANIFEST.json')
          m=json.loads(p.read_text())
          allowed={'DOWNLOADED','NOT_AVAILABLE','RETRIEVAL_FAILED'}
          years=m['years']
          assert years and years[0]['year']==2005
          for y in years:
              assert y['status'] in allowed, y
              if y['status']=='DOWNLOADED':
                  assert y['rows_downloaded']==y['rows_parsed'], y
                  assert y['unique_matches'] + y.get('exact_duplicates',0) + y.get('conflicting_duplicates',0) >= 0
          failed=[y for y in years if y['status']=='RETRIEVAL_FAILED']
          if failed:
              print('YEAR_INCOMPLETE because retrieval failed:', failed)
              sys.exit(2)
          print(f"Validated {len(years)} yearly Challenger source statuses")
          PY
      - name: Commit validated Challenger archive on main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public/tennismylife-challenger
          if git diff --cached --quiet; then echo "No Challenger archive changes"; exit 0; fi
          git commit -m "Sync TennisMyLife ATP Challenger history 2005-current"
          git push origin HEAD:main
