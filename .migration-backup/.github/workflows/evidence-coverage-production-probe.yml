name: Evidence Coverage Production Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/evidence-coverage-production-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe production route once
        shell: bash
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          EVIDENCE_COVERAGE_KEY: ${{ secrets.EVIDENCE_COVERAGE_KEY }}
        run: |
          set -u
          body="$(mktemp)"
          status="$(curl -L -sS -o "$body" -w '%{http_code}' --max-time 90 "${APP_BASE_URL}/api/evidence-coverage-diagnostic?key=${EVIDENCE_COVERAGE_KEY}" || true)"
          echo "HTTP_STATUS=$status"
          head -c 20000 "$body" || true
          echo

# production probe retrigger after Phase 21 verified-index merge and deployment propagation
