name: Sync Current ATP WTA Match Data

on:
  workflow_dispatch:
  schedule:
    - cron: "43 6 * * *"

permissions:
  contents: write

concurrency:
  group: tennis-data-history-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sync dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests beautifulsoup4 openpyxl xlrd

      - name: Sync Tennis-Data ATP/WTA history from 2005
        run: python scripts/sync-tennis-data-history.py

      - name: Validate normalized history
        run: |
          set -euo pipefail
          test -f data/public/tennis-data/MANIFEST.json
          python - <<'PY'
          import csv, glob, json, sys
          from pathlib import Path

          root=Path('data/public/tennis-data')
          manifest=json.loads((root/'MANIFEST.json').read_text())
          if manifest.get('historical_start')!='2005-01-01':
              raise SystemExit('Historical cutoff is not 2005-01-01')
          files=manifest.get('files') or []
          tours={x.get('tour') for x in files}
          if not {'ATP','WTA'}.issubset(tours):
              raise SystemExit(f'Both tours were not synced: {sorted(tours)}')
          total=0
          for path in glob.glob('data/public/tennis-data/*/*.csv'):
              with open(path,encoding='utf-8') as f:
                  rows=list(csv.DictReader(f))
              for r in rows:
                  if not r.get('date') or r['date']<'2005-01-01':
                      raise SystemExit(f'Invalid/pre-2005 row in {path}')
                  if not r.get('winner') or not r.get('loser'):
                      raise SystemExit(f'Missing player identity in {path}')
              total += len(rows)
          if total < 1000:
              raise SystemExit(f'Implausibly small normalized history: {total}')
          print(f'Validated {total} normalized ATP/WTA match rows before cross-source dedupe.')
          PY

      - name: Record freshness
        run: |
          python - <<'PY'
          import csv, glob, json
          from datetime import datetime, timezone
          from pathlib import Path
          best=''
          for path in glob.glob('data/public/tennis-data/*/*.csv'):
              with open(path,encoding='utf-8') as f:
                  for r in csv.DictReader(f):
                      d=(r.get('date') or '').strip()
                      if d>best: best=d
          payload={
              'source':'Tennis-Data ATP/WTA normalized history',
              'last_sync_utc':datetime.now(timezone.utc).isoformat(),
              'data_through':best or None,
              'historical_start':'2005-01-01',
              'dedupe_required_before_aggregation':True,
              'mode':'DYNAMIC'
          }
          Path('data/public/tennis-data/FRESHNESS.json').write_text(json.dumps(payload,indent=2)+'\n')
          PY

      - name: Commit refresh
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public/tennis-data
          if git diff --cached --quiet; then
            echo "No tennis history changes."
            exit 0
          fi
          git commit -m "Sync Tennis-Data ATP/WTA evidence"
          git push origin HEAD:main
