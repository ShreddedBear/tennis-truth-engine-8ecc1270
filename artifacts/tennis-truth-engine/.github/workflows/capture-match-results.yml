name: Capture Match Results

# Closes a real gap: captureAndResolveResults (match-result-capture.ts) and its live
# Supabase wiring (runResultCapture, match-result-capture.server.ts) were both correct and
# tested, but nothing ever invoked them -- no cron, no route, no button. A completed match
# whose real result later appears in the runtime tennis index (rebuilt here from the
# committed CSV sources, the same step drive-audit.yml already uses) would sit ungraded
# forever without this. Runs every 15 minutes -- results do not need audit-driving's 5-
# minute cadence, and this also rebuilds the tennis index, which is not free.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: capture-match-results
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build runtime tennis index from committed CSV sources
        run: node scripts/build-runtime-tennis-index.mjs

      - name: Capture and resolve real match results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run scripts/capture-match-results.ts
