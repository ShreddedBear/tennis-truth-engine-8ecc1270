name: BSD ATP Challenger PBP 2018-2023 Exhaustive Re-audit (STOPPED)

# STOPPED by explicit decision: the BSD/Bzzoiro subscription is no longer
# being purchased, so no BSD credential will be supplied to this workflow
# and no further BSD scans will run. This file is retained only as an audit
