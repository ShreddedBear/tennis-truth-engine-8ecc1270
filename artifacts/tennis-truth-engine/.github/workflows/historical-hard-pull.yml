name: Historical Hard Pull

on:
  workflow_dispatch:
    inputs:
      sources:
        description: Comma-separated sources (open_meteo,odds_api,atp,wta,atp_challenger,atp_rankings,wta_rankings)
        required: false
        default: open_meteo,odds_api
      odds_max_requests:
        description: Safety cap for historical Odds API requests
        required: false
        default: "25"
  push:
    branches:
      - main
    paths:
      - ingestion-start.flag
  pull_request:
    branches:
      - main
    paths:
      - ingestion-start.flag
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  id-token: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INGEST_SOURCES: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'atp,wta,atp_challenger,atp_rankings,wta_rankings' || inputs.sources || 'open_meteo,odds_api' }}
      INGESTION_BRIDGE_URL: https://tennis-truth-engine.lovable.app/api/warehouse-ingest
      OIDC_AUDIENCE: tennis-truth-engine-warehouse-ingestion
    steps:
      - name: Trigger Lovable-managed warehouse ingestion
        shell: bash
        run: |
          set -euo pipefail

          render_official_snapshot() {
            local source="$1" url="$2" expect="$3" out_file="$4"
            local html_file b64_file
            html_file="$(mktemp --suffix=.html)"
            b64_file="$(mktemp --suffix=.b64)"

            timeout 90s google-chrome \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --disable-blink-features=AutomationControlled \
              --user-agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36' \
              --virtual-time-budget=15000 \
              --dump-dom "$url" > "$html_file"

            if grep -qiE 'Just a moment|cf-chl|captcha|Attention Required' "$html_file"; then
              echo "ATP Official browser snapshot hit a challenge: $url" >&2
              exit 1
            fi
            if ! grep -qiE "$expect" "$html_file"; then
              echo "ATP Official browser snapshot did not contain expected content: $url" >&2
              exit 1
            fi

            gzip -c "$html_file" | base64 -w0 > "$b64_file"
            jq -nc \
              --arg source "$source" \
              --arg url "$url" \
              --rawfile body "$b64_file" \
              '{source:$source,url:$url,encoding:"gzip-base64",body:$body}' >> "$out_file"
            rm -f "$html_file" "$b64_file"
          }

          IFS=',' read -ra SOURCES <<< "$INGEST_SOURCES"
          for RAW_SOURCE in "${SOURCES[@]}"; do
            SOURCE="$(echo "$RAW_SOURCE" | xargs)"
            [ -n "$SOURCE" ] || continue

            OIDC_JSON="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
            OIDC_TOKEN="$(echo "$OIDC_JSON" | jq -r '.value')"
            if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
              echo "GitHub did not return an OIDC token" >&2
              exit 1
            fi
            echo "::add-mask::$OIDC_TOKEN"

            SNAPSHOTS_FILE="$(mktemp)"
            : > "$SNAPSHOTS_FILE"
            CURRENT_YEAR="$(date -u +%Y)"
            PREVIOUS_YEAR="$((CURRENT_YEAR - 1))"

            case "$SOURCE" in
              atp)
                for YEAR in "$PREVIOUS_YEAR" "$CURRENT_YEAR"; do
                  render_official_snapshot "$SOURCE" "https://www.atptour.com/en/scores/results-archive?year=${YEAR}&tournamentType=atp" '/en/scores/archive/|Singles Winner|TOURNAMENT RESULTS' "$SNAPSHOTS_FILE"
                done
                ;;
              atp_challenger)
                for YEAR in "$PREVIOUS_YEAR" "$CURRENT_YEAR"; do
                  render_official_snapshot "$SOURCE" "https://www.atptour.com/en/scores/results-archive?year=${YEAR}&tournamentType=ch" '/en/scores/archive/|Challenger|Singles Winner' "$SNAPSHOTS_FILE"
                done
                ;;
              atp_rankings)
                render_official_snapshot "$SOURCE" 'https://www.atptour.com/en/rankings/singles' 'Rankings|Rank|Points|Player' "$SNAPSHOTS_FILE"
                ;;
            esac

            BODY_FILE="$(mktemp)"
            jq -nc --arg source "$SOURCE" --slurpfile snapshots "$SNAPSHOTS_FILE" '{sources:[$source],official_snapshots:$snapshots}' > "$BODY_FILE"
            rm -f "$SNAPSHOTS_FILE"
            echo "Starting warehouse ingestion source: $SOURCE"

            RESPONSE_FILE="$(mktemp)"
            HTTP_STATUS="$(curl --silent --show-error \
              --location --location-trusted --post301 --post302 --post303 \
              --max-time 600 \
              -o "$RESPONSE_FILE" \
              -w '%{http_code}' \
              -X POST "$INGESTION_BRIDGE_URL" \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary "@$BODY_FILE")"
            rm -f "$BODY_FILE"
            RESPONSE="$(cat "$RESPONSE_FILE")"
            rm -f "$RESPONSE_FILE"

            echo "Bridge HTTP status for $SOURCE: $HTTP_STATUS"
            if echo "$RESPONSE" | jq . >/dev/null 2>&1; then
              echo "$RESPONSE" | jq .
            else
              echo "Bridge returned non-JSON response for $SOURCE:"
              printf '%s\n' "$RESPONSE"
            fi

            if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
              echo "Bridge HTTP request failed for $SOURCE with status $HTTP_STATUS" >&2
              exit 1
            fi

            OK="$(echo "$RESPONSE" | jq -r '.ok // false')"
            RETURNED_SOURCE="$(echo "$RESPONSE" | jq -r '.sources[0] // empty')"
            WRITTEN="$(echo "$RESPONSE" | jq -r --arg source "$SOURCE" '.result[$source].observations_written // 0')"
            TARGETS="$(echo "$RESPONSE" | jq -r --arg source "$SOURCE" '.result[$source].targets // 0')"
            REQUESTS="$(echo "$RESPONSE" | jq -r --arg source "$SOURCE" '.result[$source].requests // 0')"

            if [ "$OK" != "true" ]; then
              echo "Bridge did not return ok=true for $SOURCE" >&2
              exit 1
            fi
            if [ "$RETURNED_SOURCE" != "$SOURCE" ]; then
              echo "Bridge response source mismatch: requested=$SOURCE returned=$RETURNED_SOURCE" >&2
              exit 1
            fi
            if [ "$WRITTEN" -le 0 ]; then
              echo "False-green prevention: $SOURCE reported zero observations_written" >&2
              exit 1
            fi
            case "$SOURCE" in
              open_meteo|atp|wta|atp_challenger|atp_rankings|wta_rankings|itf_rules|atp_rules|wta_rules)
                if [ "$TARGETS" -le 0 ]; then
                  echo "False-green prevention: $SOURCE reported zero enabled targets" >&2
                  exit 1
                fi
                ;;
              odds_api)
                if [ "$REQUESTS" -le 0 ]; then
                  echo "False-green prevention: odds_api reported zero historical requests" >&2
                  exit 1
                fi
                ;;
            esac

            echo "Persistence proof accepted for $SOURCE: observations_written=$WRITTEN targets=$TARGETS requests=$REQUESTS"
          done
