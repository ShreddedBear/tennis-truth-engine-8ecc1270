name: Phase 27 wire WTA evidence

on:
  push:
    branches:
      - repair/evidence-coverage-phase27-wta-match-probe
    paths:
      - '.github/workflows/phase27-wire-wta-evidence.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/evidence-coverage-phase27-wta-match-probe
      - name: Wire official WTA match evidence into hybrid metrics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/hybrid-audit-research.server.ts')
          s=p.read_text()
          anchor='import { buildTrustedInternalFinding } from "./trusted-internal-evidence";\n'
          imp='import { officialWtaMetricRows } from "./wta-official-match-evidence.server";\n'
          if imp not in s:
              if anchor not in s: raise SystemExit('import anchor missing')
              s=s.replace(anchor,anchor+imp,1)
          old='async metrics(input){const local=localMetricRows(input.p1,input.p2,input.context,input.metrics);try{return mergeMetrics(await aiResearcher.metrics(input),local);}catch(e){if(!isProviderFailure(e))throw e;return local;}}'
          new='async metrics(input){const local=localMetricRows(input.p1,input.p2,input.context,input.metrics);let augmented=local;try{const wta=await officialWtaMetricRows({p1:input.p1,p2:input.p2,context:input.context,metrics:input.metrics});if(wta)augmented=mergeMetrics(local,wta);}catch(e){if(!isProviderFailure(e))throw e;}try{return mergeMetrics(await aiResearcher.metrics(input),augmented);}catch(e){if(!isProviderFailure(e))throw e;return augmented;}}'
          if new not in s:
              if old not in s: raise SystemExit('metrics anchor missing')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/lib/hybrid-audit-research.server.ts
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/hybrid-audit-research.server.ts
          if git diff --cached --quiet; then echo 'Already wired.'; exit 0; fi
          git commit -m 'Wire official WTA match evidence into audit metrics'
          git push origin HEAD:repair/evidence-coverage-phase27-wta-match-probe
