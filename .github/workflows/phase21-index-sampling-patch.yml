name: Phase 21 index sampling patch
on:
  push:
    branches: [repair/evidence-coverage-phase21-index-sampling]
    paths: ['.github/workflows/phase21-index-sampling-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/evidence-coverage-phase21-index-sampling
          fetch-depth: 0
      - name: Rebase repair onto current main without dropping main evidence repairs
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            git checkout --theirs src/lib/evidence-coverage-runtime-diagnostic.server.ts src/lib/evidence-coverage-runtime-diagnostic.test.ts
            git add src/lib/evidence-coverage-runtime-diagnostic.server.ts src/lib/evidence-coverage-runtime-diagnostic.test.ts
            git commit -m 'Merge current main into Evidence Coverage Phase 21'
          fi
      - name: Apply verified-index fallback on top of current main
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/lib/evidence-coverage-runtime-diagnostic.server.ts')
          s=p.read_text()
          imp='import { deterministicRulesContextMetric } from "./deterministic-rules-context-metric.server";'
          if 'sampleVerifiedEvidenceIndexMatch' not in s:
            assert imp in s
            s=s.replace(imp,imp+'\nimport { sampleVerifiedEvidenceIndexMatch } from "./evidence-index-match-sampler.server";',1)
          old='date_source:"scheduled_date"|"parsed_summary"|"created_at"|"warehouse_event_date"|"persisted_as_of_date";'
          new='date_source:"scheduled_date"|"parsed_summary"|"created_at"|"warehouse_event_date"|"persisted_as_of_date"|"verified_index_date";'
          if old in s: s=s.replace(old,new,1)
          old='sampling_source:"matches"|"source_observations"|"matches_plus_rankings"|"metric_evidence_store"'
          new='sampling_source:"matches"|"source_observations"|"matches_plus_rankings"|"metric_evidence_store"|"verified_pbp_index"'
          if old in s: s=s.replace(old,new,1)
          marker='  const missingClasses=missing(),missing_class_reasons:Partial<Record<RepresentativeId,string>>={};'
          if 'sampling_source:"verified_pbp_index"' not in s:
            insert='''  if(missing().length){\n    for(const id of missing()){\n      const row=await sampleVerifiedEvidenceIndexMatch(id);\n      if(!row)continue;\n      const level=id.replaceAll("_"," ");\n      selected.push({id,match_id:row.match_id,p1:row.p1,p2:row.p2,date:row.date,date_source:"verified_index_date",tournament:row.tournament,context:[`Tournament: ${row.tournament}`,`Level: ${level}`,`Tour: ${level}`,row.surface?`Surface: ${row.surface}`:null,`Date: ${row.date}`].filter(Boolean).join(" | "),event_level:level,surface:row.surface,sampling_source:"verified_pbp_index"});\n    }\n  }\n'''+marker
            assert marker in s
            s=s.replace(marker,insert,1)
          s=s.replace('No real persisted matches, paired warehouse observations, or ranking-proven persisted evidence pairs were available for evidence coverage sampling','No real persisted matches, paired warehouse observations, ranking-proven persisted evidence pairs, or verified PBP index matches were available for evidence coverage sampling')
          s=s.replace('REAL_PERSISTED_MATCHES_WITH_WAREHOUSE_FALLBACK','REAL_PERSISTED_MATCHES_WITH_WAREHOUSE_AND_VERIFIED_PBP_INDEX_FALLBACK')
          p.write_text(s)

          t=Path('src/lib/evidence-coverage-runtime-diagnostic.test.ts')
          ts=t.read_text()
          block='''\n\ndescribe("verified PBP index sampling fallback", () => {\n  it("uses strict verified index matches only after database sampling is exhausted", () => {\n    expect(diagnostic).toContain('sampleVerifiedEvidenceIndexMatch(id)');\n    expect(diagnostic).toContain('sampling_source:"verified_pbp_index"');\n    expect(diagnostic).toContain('date_source:"verified_index_date"');\n    expect(diagnostic).toContain('sampling_source==="matches"||match.sampling_source==="matches_plus_rankings"');\n  });\n});\n'''
          if 'verified PBP index sampling fallback' not in ts: t.write_text(ts+block)
          PY
      - name: Test focused Evidence Coverage repair
        run: |
          if [ -f bun.lockb ] || [ -f bun.lock ]; then
            curl -fsSL https://bun.sh/install | bash
            export PATH="$HOME/.bun/bin:$PATH"
            bun install --frozen-lockfile
            bunx vitest run src/lib/evidence-index-match-sampler.test.ts src/lib/evidence-coverage-runtime-diagnostic.test.ts
          else
            npm ci
            npx vitest run src/lib/evidence-index-match-sampler.test.ts src/lib/evidence-coverage-runtime-diagnostic.test.ts
          fi
      - name: Commit and push resolved Phase 21
        run: |
          set -euo pipefail
          git add src/lib/evidence-coverage-runtime-diagnostic.server.ts src/lib/evidence-coverage-runtime-diagnostic.test.ts src/lib/evidence-index-match-sampler.server.ts src/lib/evidence-index-match-sampler.test.ts
          if ! git diff --cached --quiet; then git commit -m 'Rebase and validate verified PBP index representative sampling'; fi
          git push origin HEAD:repair/evidence-coverage-phase21-index-sampling
