name: Temporary Evidence Production Proof

on:
  push:
    branches: [diagnostic/evidence-prod-proof-c66]
    paths: ['.github/workflows/tmp-evidence-prod-proof.yml']

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe published diagnostic
        shell: bash
        run: |
          set -euo pipefail
          url='https://tennis-truth-engine.lovable.app/api/evidence-coverage-diagnostic?key=ECOV-20260825-b6f1'
          code=$(curl -sS -L --max-time 180 -o /tmp/ecov.json -w '%{http_code}' "$url")
          echo "http_status=$code"
          test "$code" = "200"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ecov.json'))
          print('wrapper_keys=',sorted(d.keys()))
          r=d.get('report') or d.get('result') or d.get('data') or d.get('diagnostic') or d
          print('ok=',d.get('ok'))
          print('schema_version=',r.get('schema_version'))
          print('metrics=',r.get('metrics'))
          print('sampling=',json.dumps(r.get('sampling'),sort_keys=True))
          matches=r.get('matches',[])
          print('match_count=',len(matches))
          for m in matches:
              print('MATCH',m.get('id'),m.get('pair'),'sampling_source=',m.get('sampling_source'),'date_source=',m.get('date_source'))
              print('CANONICAL',json.dumps(m.get('canonical_identity_resolution'),sort_keys=True))
              print('COVERAGE',json.dumps(m.get('coverage'),sort_keys=True))
              print('FALSE_GREEN',json.dumps(m.get('false_green_guard'),sort_keys=True))
              print('BUCKETS',json.dumps(m.get('failure_buckets'),sort_keys=True))
              interesting=[x for x in m.get('metrics',[]) if x.get('metric_code') in {'014','016'}]
              print('INTERESTING',json.dumps(interesting,sort_keys=True))
          if not matches:
              raise SystemExit('diagnostic returned no representative matches')
          if any(not (m.get('false_green_guard') or {}).get('passed') for m in matches):
              raise SystemExit('false-green guard failed')
          PY
