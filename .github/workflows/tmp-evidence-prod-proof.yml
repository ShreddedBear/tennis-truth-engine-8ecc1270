name: Temporary Evidence Production Proof

on:
  push:
    branches: [diagnostic/evidence-prod-proof-c66]
    paths: ['.github/workflows/tmp-evidence-prod-proof.yml']

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe published diagnostic
        shell: bash
        run: |
          set -euo pipefail
          url='https://tennis-truth-engine.lovable.app/api/evidence-coverage-diagnostic?key=ECOV-20260825-b6f1'
          code=$(curl -sS -L --max-time 180 -o /tmp/ecov.json -w '%{http_code}' "$url")
          echo "http_status=$code"
          test "$code" = "200"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ecov.json'))
          r=d.get('report') or d.get('result') or d.get('data') or d.get('diagnostic') or d
          print('sampling=',json.dumps(r.get('sampling'),sort_keys=True))
          matches=r.get('matches',[])
          for m in matches:
              print('MATCH',m.get('id'),m.get('pair'))
              print('COVERAGE',json.dumps(m.get('coverage'),sort_keys=True))
              print('FALSE_GREEN',json.dumps(m.get('false_green_guard'),sort_keys=True))
              details=m.get('metrics',[])
              for bucket in ['INGESTION_MISSING','SOURCE_MISSING','EVIDENCE_WIRING_FAILURE','RECONSTRUCTION_FAILURE','COVERAGE_CREDIT_FAILURE']:
                  rows=[{'code':x.get('metric_code'),'name':x.get('metric_name'),'expected':x.get('source_expected'),'warehouse':x.get('warehouse_observation_count'),'reason':x.get('reason')} for x in details if x.get('failure_bucket')==bucket]
                  print(bucket,json.dumps(rows,sort_keys=True))
          if not matches: raise SystemExit('diagnostic returned no representative matches')
          if any(not (m.get('false_green_guard') or {}).get('passed') for m in matches): raise SystemExit('false-green guard failed')
          PY
