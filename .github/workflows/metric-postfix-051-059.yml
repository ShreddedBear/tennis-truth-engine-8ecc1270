name: Post-Fix Metric Wiring 051 052 053 054 059

on:
  push:
    branches:
      - audit/postfix-051-052-053-054-059
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run post-fix wiring tests
        run: bunx vitest run src/lib/metric-wiring-postfix-051-059.test.ts

      - name: Run full regression suite
        run: bunx vitest run

      - name: Build app
        run: bun run build
