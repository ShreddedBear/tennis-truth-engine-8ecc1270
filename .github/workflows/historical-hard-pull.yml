name: Historical Hard Pull

on:
  workflow_dispatch:
    inputs:
      sources:
        description: Comma-separated sources (open_meteo,odds_api)
        required: false
        default: open_meteo,odds_api
      odds_max_requests:
        description: Safety cap for historical Odds API requests
        required: false
        default: "25"
  push:
    branches:
      - warehouse-first-audit-20260823
    paths:
      - ingestion-start.flag
  schedule:
    - cron: "17 6 * * 1"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      INGEST_SOURCES: ${{ inputs.sources || 'open_meteo,odds_api' }}
      ODDS_MAX_REQUESTS: ${{ inputs.odds_max_requests || '25' }}
      ODDS_BACKFILL_FROM: "2020-06-06T00:00:00Z"
      ODDS_REGIONS: "us"
      ODDS_MARKETS: "h2h"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run historical ingestion
        run: bun scripts/run-historical-ingestion.ts
