name: Temporary Phase 24 Sampler Repair

on:
  push:
    branches: [repair/evidence-coverage-phase24-sampler]
    paths: ['.github/workflows/tmp-phase24-sampler-inspect.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Patch deployment-safe sampler and diagnostic priority
        shell: python
        run: |
          from pathlib import Path

          p=Path('src/lib/evidence-index-match-sampler.server.ts')
          s=p.read_text()
          anchor='''const SPECS: Record<EvidenceIndexSample["id"], { dir: string; years: number[]; floor: string }> = {\n  ATP_MAIN: { dir: "bsd-atp-main-pbp-history", years: [2026, 2025, 2024], floor: "2024-01-01" },\n  WTA_MAIN: { dir: "bsd-wta-main-pbp-history", years: [2026, 2025, 2024], floor: "2024-12-02" },\n  ATP_CHALLENGER: { dir: "bsd-atp-challenger-pbp-history", years: [2026, 2025], floor: "2025-01-01" },\n};\n'''
          manifest='''\n// Deployment-safe representative rows generated from the checked-in verified PBP indexes.\n// These are diagnostic sampling identities only; they never attach PBP or create evidence.\n// Runtime filesystem access remains preferred so a newer checked-in verified row wins when available.\nexport const BUNDLED_VERIFIED_EVIDENCE_INDEX_SAMPLES: Record<EvidenceIndexSample["id"], EvidenceIndexSample> = {\n  ATP_MAIN: { id: "ATP_MAIN", match_id: "verified-index:ATP_MAIN:43148", p1: "Alejandro Tabilo", p2: "Tiago Torres", date: "2026-07-22", tournament: "Estoril", surface: "clay" },\n  WTA_MAIN: { id: "WTA_MAIN", match_id: "verified-index:WTA_MAIN:43309", p1: "Fiona Ferro", p2: "Erika Andreeva", date: "2026-07-22", tournament: "Palermo, Italy", surface: "clay" },\n  ATP_CHALLENGER: { id: "ATP_CHALLENGER", match_id: "verified-index:ATP_CHALLENGER:31912", p1: "Leandro Riedi", p2: "Yunchaokete Bu", date: "2026-04-19", tournament: "Busan, South Korea", surface: "hard" },\n};\n'''
          if 'BUNDLED_VERIFIED_EVIDENCE_INDEX_SAMPLES' not in s:
              if anchor not in s: raise SystemExit('sampler SPECS anchor missing')
              s=s.replace(anchor,anchor+manifest,1)
          old='''  return null;\n}\n'''
          new='''  return BUNDLED_VERIFIED_EVIDENCE_INDEX_SAMPLES[id] ?? null;\n}\n'''
          pos=s.rfind(old)
          if pos < 0: raise SystemExit('sampler terminal return anchor missing')
          s=s[:pos]+s[pos:].replace(old,new,1)
          p.write_text(s)

          d=Path('src/lib/evidence-coverage-runtime-diagnostic.server.ts')
          ds=d.read_text()
          persisted='''  if(missing().some(id=>id==="ATP_MAIN"||id==="WTA_MAIN")){\n    const persisted=await db.from("metric_evidence_store")'''
          verified='''  // Prefer a real, strictly classified verified-index match before synthetic persisted-pair sampling.\n  // This keeps representative validation tied to an actual match and also survives deployments that omit data/ files.\n  if(missing().length){\n    for(const id of missing()){\n      const row=await sampleVerifiedEvidenceIndexMatch(id);\n      if(!row)continue;\n      const level=id.replaceAll("_"," ");\n      selected.push({id,match_id:row.match_id,p1:row.p1,p2:row.p2,date:row.date,date_source:"verified_index_date",tournament:row.tournament,context:[`Tournament: ${row.tournament}`,`Level: ${level}`,`Tour: ${level}`,row.surface?`Surface: ${row.surface}`:null,`Date: ${row.date}`].filter(Boolean).join(" | "),event_level:level,surface:row.surface,sampling_source:"verified_pbp_index"});\n    }\n  }\n'''
          if 'Prefer a real, strictly classified verified-index match before synthetic persisted-pair sampling.' not in ds:
              if persisted not in ds: raise SystemExit('persisted fallback anchor missing')
              ds=ds.replace(persisted,verified+persisted,1)
          d.write_text(ds)

          t=Path('src/lib/evidence-coverage-runtime-diagnostic.test.ts')
          ts=t.read_text()
          marker='''  it("documents representative classes that cannot be sampled from current persisted production data", () => {'''
          block='''  it("prefers deployment-safe verified match samples before synthetic persisted-pair fallback", () => {\n    expect(diagnostic).toContain("Prefer a real, strictly classified verified-index match before synthetic persisted-pair sampling.");\n    const verifiedPriority = diagnostic.indexOf('const row=await sampleVerifiedEvidenceIndexMatch(id);');\n    const persistedFallback = diagnostic.indexOf('const persisted=await db.from("metric_evidence_store")');\n    expect(verifiedPriority).toBeGreaterThan(-1);\n    expect(persistedFallback).toBeGreaterThan(verifiedPriority);\n  });\n\n'''
          if block.strip() not in ts:
              if marker not in ts: raise SystemExit('diagnostic test marker missing')
              ts=ts.replace(marker,block+marker,1)
          t.write_text(ts)

          st=Path('src/lib/evidence-index-match-sampler.test.ts')
          st.write_text('''import { describe, expect, it } from "vitest";\nimport { BUNDLED_VERIFIED_EVIDENCE_INDEX_SAMPLES, sampleVerifiedEvidenceIndexMatch } from "./evidence-index-match-sampler.server";\n\ndescribe("deployment-safe verified evidence index sampler", () => {\n  it("bundles one strictly typed real representative for every required class", () => {\n    expect(Object.keys(BUNDLED_VERIFIED_EVIDENCE_INDEX_SAMPLES).sort()).toEqual(["ATP_CHALLENGER", "ATP_MAIN", "WTA_MAIN"]);\n    for (const [id,row] of Object.entries(BUNDLED_VERIFIED_EVIDENCE_INDEX_SAMPLES)) {\n      expect(row.id).toBe(id);\n      expect(row.match_id).toMatch(/^verified-index:/);\n      expect(row.p1).not.toBe(row.p2);\n      expect(row.date).toMatch(/^2026-/);\n      expect(row.tournament.length).toBeGreaterThan(2);\n    }\n  });\n  it("still resolves all required samples from the checked-in indexes in CI", async () => {\n    for (const id of ["ATP_MAIN","WTA_MAIN","ATP_CHALLENGER"] as const) {\n      const row=await sampleVerifiedEvidenceIndexMatch(id);\n      expect(row).not.toBeNull();\n      expect(row?.id).toBe(id);\n    }\n  });\n});\n''')
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Targeted Evidence Coverage tests
        run: bunx vitest run src/lib/evidence-index-match-sampler.test.ts src/lib/evidence-coverage-runtime-diagnostic.test.ts
      - name: Full regression suite
        run: bunx vitest run
      - name: Production build
        run: bun run build
      - name: Commit Phase 24 repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/evidence-index-match-sampler.server.ts src/lib/evidence-index-match-sampler.test.ts src/lib/evidence-coverage-runtime-diagnostic.server.ts src/lib/evidence-coverage-runtime-diagnostic.test.ts
          git commit -m 'Make representative Evidence Coverage sampling deployment-safe'
          git push
