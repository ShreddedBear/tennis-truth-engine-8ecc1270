name: Evidence Live Contract Dispatch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/evidence-live-contract-dispatch.yml
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to patch
        required: false
        default: evidence-live-contract

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.target_branch || 'evidence-live-contract' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Patch live metric research evidence contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/audit-research.server.ts')
          s = p.read_text()
          marker = 'SIDE-SPECIFIC EVIDENCE CONTRACT — REQUIRED FOR EVERY NON-UNAVAILABLE/NON-EXCLUDED SIDE:'
          if marker not in s:
              anchor = '''Treatment per player: DIRECT (the exact metric itself is published at a named source), RECONSTRUCTED (the exact metric is computed from all required named-source components and the calculation/components are stated), PARTIAL (some but not all exact required inputs/observations are sourced; never use a proxy or merely correlated statistic), UNAVAILABLE (the exact metric cannot be satisfied from admissible sourced inputs, including cases where only a proxy exists), EXCLUDED (post-match or inadmissible).\nDo not substitute a convenient statistic for the statistic the definition actually requires.'''
              replacement = '''Treatment per player: DIRECT (the exact metric itself is published at a named source), RECONSTRUCTED (the exact metric is computed from all required named-source components and the calculation/components are stated), PARTIAL (some but not all exact required inputs/observations are sourced; never use a proxy or merely correlated statistic), UNAVAILABLE (the exact metric cannot be satisfied from admissible sourced inputs, including cases where only a proxy exists), EXCLUDED (post-match or inadmissible).\n\nSIDE-SPECIFIC EVIDENCE CONTRACT — REQUIRED FOR EVERY NON-UNAVAILABLE/NON-EXCLUDED SIDE:\n- p1_value MUST begin exactly with PLAYER=${p1}; p2_value MUST begin exactly with PLAYER=${p2}. Never infer identity from row order.\n- Immediately include SOURCE=<exact source_name> where that exact source_name also appears in this row's sources array and directly supports that player's surviving value. Do not use a source that only supports the opponent or another component.\n- Immediately include SAMPLE=<actual side-specific denominator/window>. Do not copy the other player's sample and do not use a generic shared sample when the side-specific sample is unknown. If the source gives a time window but no numeric denominator, state that exact sourced window as SAMPLE. If neither a denominator nor a defensible source-defined window exists, that side is UNAVAILABLE.\n- After PLAYER/SOURCE/SAMPLE, include only exact master-definition component names and their sourced values/observations. Neighboring/proxy fields remain inadmissible.\n- For RECONSTRUCTED, also include INPUTS=<pipe-separated exact raw input names>; FORMULA=<explicit calculation>. Every listed input must be sourced, permitted by the metric definition, and actually referenced by the formula. If you cannot provide the complete exact inputs and formula, do not label the side RECONSTRUCTED.\n- The row-level sources array MUST contain every source named by either side and must not contain invented sources.\n- The row-level sample field is only a display summary; it never substitutes for the side-specific SAMPLE tag.\n\nExample value format (illustrative structure only, never copy the numbers): PLAYER=Exact Player; SOURCE=Named Public Source; SAMPLE=last 20 matches; Exact Component=...\nExample reconstructed format: PLAYER=Exact Player; SOURCE=Named Public Source; SAMPLE=30 matches; INPUTS=input_a|input_b; FORMULA=input_a-input_b; Exact Component=...\n\nDo not substitute a convenient statistic for the statistic the definition actually requires.'''
              if anchor not in s:
                  raise SystemExit('metrics prompt anchor not found; refusing blind patch')
              s = s.replace(anchor, replacement, 1)
              p.write_text(s)
          t = Path('src/lib/live-research-evidence-contract.test.ts')
          t.write_text('''import { describe, expect, it } from "vitest";\nimport { readFileSync } from "node:fs";\nimport { join } from "node:path";\n\ndescribe("live research side-specific evidence contract", () => {\n  const source = readFileSync(join(process.cwd(), "src/lib/audit-research.server.ts"), "utf8");\n  it("requires explicit player/source/sample lineage for each usable side", () => {\n    expect(source).toContain("SIDE-SPECIFIC EVIDENCE CONTRACT — REQUIRED");\n    expect(source).toContain("p1_value MUST begin exactly with PLAYER=${p1}");\n    expect(source).toContain("p2_value MUST begin exactly with PLAYER=${p2}");\n    expect(source).toContain("SOURCE=<exact source_name>");\n    expect(source).toContain("SAMPLE=<actual side-specific denominator/window>");\n  });\n  it("requires complete reconstruction inputs and formula without weakening proxy rejection", () => {\n    expect(source).toContain("INPUTS=<pipe-separated exact raw input names>");\n    expect(source).toContain("FORMULA=<explicit calculation>");\n    expect(source).toContain("Every listed input must be sourced, permitted by the metric definition, and actually referenced by the formula");\n    expect(source).toContain("Neighboring/proxy fields remain inadmissible");\n  });\n  it("keeps row sources subordinate to side-specific provenance", () => {\n    expect(source).toContain("row-level sources array MUST contain every source named by either side");\n    expect(source).toContain("row-level sample field is only a display summary");\n  });\n});\n''')
          PY
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Targeted evidence-contract tests
        run: bunx vitest run src/lib/live-research-evidence-contract.test.ts src/lib/trusted-internal-evidence.test.ts src/lib/trusted-internal-evidence-ci.test.ts
      - name: Full regression suite
        run: bunx vitest run
      - name: Build app
        run: bun run build
      - name: Commit verified patch to target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/audit-research.server.ts src/lib/live-research-evidence-contract.test.ts
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
          else
            git commit -m "Harden live research evidence contract"
            git push origin HEAD:${TARGET_BRANCH}
          fi
