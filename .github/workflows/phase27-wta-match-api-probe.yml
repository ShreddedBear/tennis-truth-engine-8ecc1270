name: Phase 27 WTA match API probe

on:
  push:
    branches:
      - repair/evidence-coverage-phase27-wta-match-probe
    paths:
      - '.github/workflows/phase27-wta-match-api-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe WTA official match endpoints
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api.wtatennis.com/tennis'
          GROUP_ID=901
          YEAR=2026

          probe() {
            local url="$1"
            local body status ctype
            body="$(mktemp)"
            status="$(curl --silent --show-error --location -o "$body" -w '%{http_code}' "$url" || true)"
            ctype="$(jq -r 'type' "$body" 2>/dev/null || echo non-json)"
            echo "PROBE|$status|$ctype|$url"
            if jq . "$body" >/dev/null 2>&1; then
              jq -c 'if type=="object" then {keys:(keys),pageInfo:(.pageInfo // null),contentCount:(.content|length? // 0),matchesType:(.matches|type? // null),matchesCount:(.matches|length? // 0),firstContent:(.content[0] // null),firstMatch:(.matches[0] // null),tournament:(.tournament // null)} elif type=="array" then {count:length,first:(.[0] // null)} else . end' "$body" | head -c 24000 || true
              echo
            else
              head -c 800 "$body" || true
              echo
            fi
            rm -f "$body"
          }

          probe "$BASE/tournaments?tournamentGroupId=$GROUP_ID&page=0&pageSize=100"
          probe "$BASE/tournaments/$GROUP_ID/$YEAR"
          probe "$BASE/tournaments/$GROUP_ID/$YEAR/matches?page=0&pageSize=10"
