name: BSD WTA Challenger PBP Quarantine Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bsd-wta-challenger-pbp-quarantine-audit.yml'
      - 'scripts/audit-wta-challenger-pbp-quarantine.py'

permissions:
  contents: write

concurrency:
  group: bsd-wta-challenger-pbp-quarantine-audit
  cancel-in-progress: true

jobs:
  audit-quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BSD_TENNIS_API_KEY: ${{ secrets.BSD_TENNIS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify BSD API secret
        run: test -n "$BSD_TENNIS_API_KEY"
      - name: Re-fetch and audit all quarantined WTA Challenger PBP
        run: python3 scripts/audit-wta-challenger-pbp-quarantine.py | tee /tmp/wta-challenger-quarantine-audit.log
      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          s=json.load(open('data/audit/bsd-wta-challenger-pbp-quarantine-audit/summary.json'))
          assert s['scope']=='WTA Challenger/WTA 125 quarantine re-audit only'
          assert s['other_tours_excluded'] is True
          assert s['input_quarantined']==155
          PY
      - name: Commit quarantine audit and clean promotions only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/audit/bsd-wta-challenger-pbp-quarantine-audit
          git add data/metrics/pbp/wta_challenger/approved-index.jsonl
          if git diff --cached --quiet; then echo 'No quarantine audit changes to commit.'; exit 0; fi
          git commit -m 'Audit WTA Challenger PBP quarantine'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsd-wta-challenger-pbp-quarantine-audit-${{ github.run_id }}
          path: |
            /tmp/wta-challenger-quarantine-audit.log
            data/audit/bsd-wta-challenger-pbp-quarantine-audit/
          if-no-files-found: warn
      - name: Job summary
        if: always()
        run: |
          echo '## BSD WTA Challenger PBP Quarantine Audit' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/audit/bsd-wta-challenger-pbp-quarantine-audit/summary.md ]; then cat data/audit/bsd-wta-challenger-pbp-quarantine-audit/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
