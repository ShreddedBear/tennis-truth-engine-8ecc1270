name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Diagnostic CI: package.json has moved ahead of the checked-in Bun lockfile.
      # Allow Bun to resolve the existing dependency declarations so the workflow
      # can reach the actual application build. This does not commit lockfile changes.
      - name: Install dependencies
        run: bun install

      - name: Run regression tests
        run: bunx vitest run

      - name: Build app
        run: bun run build
