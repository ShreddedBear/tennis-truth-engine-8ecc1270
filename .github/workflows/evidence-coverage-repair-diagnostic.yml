name: Evidence Coverage Repair Diagnostic

on:
  push:
    branches:
      - repair/evidence-coverage
      - repair/evidence-coverage-phase2
      - repair/evidence-coverage-phase2-integrated
      - repair/evidence-coverage-phase3
      - repair/evidence-coverage-phase4
      - repair/evidence-coverage-phase5
      - repair/evidence-coverage-phase6
      - repair/evidence-coverage-phase7
      - repair/evidence-coverage-phase8
      - repair/evidence-coverage-phase9
      - repair/evidence-coverage-phase10
      - repair/evidence-coverage-phase11-sampling
      - repair/evidence-coverage-phase14-bsd-deterministic
    paths:
      - scripts/evidence-coverage-baseline.ts
      - .github/workflows/evidence-coverage-repair-diagnostic.yml
      - supabase/migrations/*evidence*.sql
      - src/lib/evidence-player-alias.ts
      - src/lib/evidence-player-alias.test.ts
      - src/lib/evidence-canonical-identity.server.ts
      - src/lib/source-observation-metric-bridge.server.ts
      - src/lib/source-observation-metric-bridge.test.ts
      - src/lib/warehouse-first-researcher.server.ts
      - src/lib/evidence-finding-selection.test.ts
      - src/lib/persisted-evidence-alias-dedupe.test.ts
      - src/lib/evidence-coverage-runtime-diagnostic.server.ts
      - src/lib/evidence-coverage-runtime-diagnostic.test.ts
      - src/lib/deterministic-ranking-metrics.server.ts
      - src/lib/deterministic-ranking-metrics.test.ts
      - src/lib/deterministic-results-schedule-metrics.server.ts
      - src/lib/deterministic-results-schedule-metrics.test.ts
      - src/lib/deterministic-market-metrics.server.ts
      - src/lib/deterministic-market-metrics.test.ts
      - src/lib/deterministic-pbp-metrics.server.ts
      - src/lib/deterministic-pbp-metrics.test.ts
      - src/lib/deterministic-environment-metrics.server.ts
      - src/lib/deterministic-environment-metrics.test.ts
      - src/lib/deterministic-rules-context-metric.server.ts
      - src/lib/bsd-atp-main-pbp.server.ts
      - src/lib/bsd-wta-main-pbp.server.ts
      - src/lib/bsd-atp-challenger-pbp.server.ts
      - src/lib/bsd-wta-challenger-pbp.server.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-coverage-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic-code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate evidence identity firewall
        run: bunx vitest run src/lib/evidence-player-alias.test.ts src/lib/evidence-coverage-runtime-diagnostic.test.ts
      - name: Validate deterministic PBP evidence
        run: bunx vitest run src/lib/deterministic-pbp-metrics.test.ts
      - name: Validate tournament-scoped environment evidence
        run: bunx vitest run src/lib/deterministic-environment-metrics.test.ts
      - name: Validate pair-complete selection priority
        run: bunx vitest run src/lib/evidence-finding-selection.test.ts
      - name: Validate persisted alias dedupe
        run: bunx vitest run src/lib/persisted-evidence-alias-dedupe.test.ts
      - name: Validate full regression suite
        run: bunx vitest run
      - name: Explain production-data execution boundary
        run: |
          echo "Production Supabase credentials are Lovable-managed and are intentionally not copied into GitHub Actions."
          echo "Real production evidence counts/baselines are inspected through the production diagnostic endpoint without copying credentials into CI."
          echo "This workflow validates the diagnostic and downstream repair code without weakening credential boundaries."
