name: Round Robin Audit Start

on:
  push:
    paths:
      - '.github/workflows/round-robin-audit-start.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch upload audit scheduler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/app/upload.tsx')
          s = p.read_text()
          old = '''let runs=0;for(const matchId of auditedMatchIds){try{for(let chunk=0;chunk<20;chunk++){const result=await executePipeline({data:{matchId}});if(!result.ok)throw new Error(result.failures[0]?.message??"Pipeline failed to start");if(result.complete||!result.nextStage)break;}runs++;}catch(e){const message=recordError("AUDIT PIPELINE",e,{match:matchId});toast.error(`Audit run failed: ${message}`);}}'''
          new = '''let runs=0;const pending=new Set(auditedMatchIds);const failed=new Set<string>();
          // First pass: every uploaded match gets one pipeline slice before any match gets a second slice.
          // This guarantees every match receives/starts Run 1 even if a later continuation call is slow or the client disconnects.
          for(const matchId of [...pending]){try{const result=await executePipeline({data:{matchId}});if(!result.ok)throw new Error(result.failures[0]?.message??"Pipeline failed to start");runs++;if(result.complete||!result.nextStage)pending.delete(matchId);}catch(e){failed.add(matchId);pending.delete(matchId);const message=recordError("AUDIT PIPELINE",e,{match:matchId});toast.error(`Audit run failed: ${message}`);}}
          // Continue unfinished matches round-robin: at most one slice per match per round.
          for(let round=0;round<19&&pending.size;round++){for(const matchId of [...pending]){try{const result=await executePipeline({data:{matchId}});if(!result.ok)throw new Error(result.failures[0]?.message??"Pipeline continuation failed");if(result.complete||!result.nextStage)pending.delete(matchId);}catch(e){failed.add(matchId);pending.delete(matchId);const message=recordError("AUDIT PIPELINE",e,{match:matchId});toast.error(`Audit run failed: ${message}`);}}}'''
          if old not in s:
              raise SystemExit('Expected sequential audit loop not found; refusing to modify file')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit scheduler fix
        run: |
          if git diff --quiet; then
            echo 'No change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/app/upload.tsx
          git commit -m 'Start uploaded audits round-robin so no match stays at zero'
          git push
