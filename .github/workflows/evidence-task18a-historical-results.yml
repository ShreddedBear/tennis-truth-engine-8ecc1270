name: Evidence Coverage Task 18A Historical Results

on:
  workflow_dispatch:
  push:
    branches:
      - repair/evidence-coverage-task18a-historical-results
    paths:
      - 'scripts/build-runtime-tennis-index.mjs'
      - 'scripts/task18a-source-schema-audit.mjs'
      - 'scripts/task18a-cell-accounting.ts'
      - 'src/lib/historical-results-recovery.ts'
      - 'src/lib/historical-results-recovery.test.ts'
      - 'src/lib/deterministic-historical-results-metrics.server.ts'
      - 'src/lib/deterministic-historical-results-metrics.test.ts'
      - 'src/lib/deterministic-results-schedule-metrics.server.ts'
      - 'src/lib/repository-results-history.server.ts'
      - 'src/lib/metric-source-family-policy.ts'
      - '.github/workflows/evidence-task18a-historical-results.yml'

permissions:
  contents: write

concurrency:
  group: evidence-task18a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Audit repository source schemas
        run: node scripts/task18a-source-schema-audit.mjs
      - name: Persist source schema audit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/evidence-coverage/task18a-source-schema-audit.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/evidence-coverage/task18a-source-schema-audit.json
          git commit -m 'Task 18A: record repository source schemas'
          git push origin HEAD:repair/evidence-coverage-task18a-historical-results
      - name: Build four-tour repository evidence index
        run: node scripts/build-runtime-tennis-index.mjs
      - name: Task 18A reconstruction and false-green tests
        run: bunx vitest run src/lib/historical-results-recovery.test.ts src/lib/deterministic-historical-results-metrics.test.ts
      - name: Production four-tour cell accounting
        run: bun scripts/task18a-cell-accounting.ts
      - name: Identity and match foundations
        run: bunx vitest run src/lib/evidence-player-alias.test.ts src/lib/evidence-match-identity.test.ts
      - name: Existing results and evidence accounting foundations
        run: bunx vitest run src/lib/deterministic-results-schedule-metrics.test.ts src/lib/metric-source-family-policy.test.ts
      - name: Build application
        run: bun run build
