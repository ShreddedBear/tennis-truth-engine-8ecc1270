name: Fix Imported Wiring Audit
on:
  push:
    paths:
      - '.github/workflows/fix-imported-wiring-audit.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct imported metric wiring and provenance
        shell: python
        run: |
          from pathlib import Path
          import re

          # ---- hybrid local-evidence mapper ----
          p=Path('src/lib/hybrid-audit-research.server.ts')
          s=p.read_text()

          old='function summarize(map:Map<string,SourcedStat>,keys:string[]){const p=keys.map(k=>map.get(k)).filter((x):x is SourcedStat=>!!x);return p.length?p.map(s=>`${s.key}=${Number(s.value).toFixed(2)}`).join("; "):null;}'
          new='''function pickedStats(map:Map<string,SourcedStat>,keys:string[]){return keys.map(k=>map.get(k)).filter((x):x is SourcedStat=>!!x);}\nfunction summarize(map:Map<string,SourcedStat>,keys:string[]){const p=pickedStats(map,keys);return p.length?p.map(s=>`${s.key}=${Number(s.value).toFixed(2)}`).join("; "):null;}\nfunction summaryMeta(map:Map<string,SourcedStat>,keys:string[]){const p=pickedStats(map,keys);if(!p.length)return null;const samples=p.map(x=>x.sample).filter((x):x is number=>typeof x==="number"&&Number.isFinite(x));const sources=p.flatMap(x=>x.sources??[]).filter((x,i,a)=>a.findIndex(y=>y.source_name===x.source_name&&y.url===x.url)===i);return{sample:samples.length?Math.min(...samples):null,sources};}'''
          if old not in s: raise SystemExit('summarize anchor missing')
          s=s.replace(old,new,1)

          start='function summaryFor(map:Map<string,SourcedStat>,code:string){const f=familyCode(code),get=(k:string)=>map.get(k)?.value;let value:string|null=null;'
          repl='function summaryFor(map:Map<string,SourcedStat>,code:string){const f=familyCode(code);let value:string|null=null,usedKeys:string[]=[];const use=(keys:string[])=>{usedKeys=keys;return summarize(map,keys);};'
          if start not in s: raise SystemExit('summaryFor start anchor missing')
          s=s.replace(start,repl,1)
          s=s.replace('value=summarize(map,','value=use(')

          def replace_family(code, keys):
              nonlocal_dummy = None
              pattern=rf'if\(f==="{code}"\)value=use\(\[.*?\]\);'
              replacement=f'if(f==="{code}")value=use({keys});'
              nonlocal_s=re.sub(pattern,replacement,s,count=1)
              if nonlocal_s==s: raise SystemExit(f'family {code} summary anchor missing')
              return nonlocal_s

          s=replace_family('001','["surface_elo","current_surface_elo","peak_surface_elo","observed_peak_surface_elo","surface_win_pct","surface_matches","surface_elo_trend","surface_elo_change_last10","peak_vs_current_elo_gap","surface_elo_below_peak","surface_win_pct_52w","surface_matches_52w"]')
          s=replace_family('004','["service_points_won_pct","return_points_won_pct","total_points_won_pct","hold_pct","break_pct","matchup_expected_hold_pct","matchup_expected_break_pct","expected_hold_break_differential","dominance_ratio","combined_point_efficiency"]')
          s=replace_family('005','["last5_win_pct","last10_win_pct","last5_set_win_pct","last10_set_win_pct","current_surface_recent_win_pct","win_pct_60d","win_pct_90d","recent_form_trend","recent_straight_set_control_pct","recent_performance_acceleration","avg_sets_conceded_in_recent_wins","set_margin_mean","overall_recent20_win_pct"]')
          s=replace_family('006','["recent_opponent_avg_elo","best_recent_win_opponent_elo","bad_loss_rate_pct","comparable_strength_win_pct","performance_vs_comparable_strength_pct"]')
          s=replace_family('013','["longest_observed_layoff_days","observed_layoffs_30d_plus","observed_layoffs_60d_plus","observed_layoffs_90d_plus","return_after_layoff_win_pct"]')
          s=replace_family('030','["same_tournament_matches","same_tournament_win_pct"]')
          s=replace_family('035','["observed_vs_expected_wl_gap_pct"]')

          # Ranking Context requires actual ranking evidence. This repository's
          # strength module explicitly says Elo must not be labeled as ranking.
          s=re.sub(r'if\(f==="014"\)\{.*?\}', 'if(f==="014")value=null;', s, count=1)

          # Add the matchup-specific compatibility values to the family they
          # actually belong to instead of Combined Efficiency / Momentum.
          marker='if(f==="021")value=use(["match_surface_hard","match_surface_clay","match_surface_grass","match_surface_carpet","match_indoor","verified_court_speed_index","verified_court_speed_band","match_temperature_c","match_humidity_pct","match_wind_kph","match_altitude_m","match_roof_closed"]);'
          add=marker+'if(f==="023")value=use(["serve_vs_opponent_return_edge","return_vs_opponent_serve_edge","serve_aggression_proxy","serve_reliance_proxy","return_pressure_proxy","balanced_efficiency_proxy","close_match_resilience_proxy","style_serve_vs_return_edge","style_return_vs_serve_edge","style_balance_edge","style_resilience_edge"]);'
          if marker not in s: raise SystemExit('021 marker missing')
          s=s.replace(marker,add,1)

          end='if(!value)return null;const first=[...map.values()][0];return{value,sample:first?.sample??null,sources:first?.sources??[]};}'
          end_new='if(!value)return null;const meta=summaryMeta(map,usedKeys);return{value,sample:meta?.sample??null,sources:meta?.sources??[]};}'
          if end not in s: raise SystemExit('summaryFor provenance tail missing')
          s=s.replace(end,end_new,1)

          # A broad master metric is only partially covered by these local
          # historical summaries unless a later live source supplies more.
          s=s.replace('p1_treatment:xs?"RECONSTRUCTED":"UNAVAILABLE"','p1_treatment:xs?"PARTIAL":"UNAVAILABLE"')
          s=s.replace('p2_treatment:ys?"RECONSTRUCTED":"UNAVAILABLE"','p2_treatment:ys?"PARTIAL":"UNAVAILABLE"')
          p.write_text(s)

          # ---- deterministic reconstruction spec ----
          p=Path('src/lib/reconstruction/specs.ts')
          s=p.read_text()
          pattern=r'''\n  \{\n    id: "RS-CMB-02",\n    output: "dominance_ratio",\n    formula: "return_points_won_pct / \(100 − service_points_won_pct\)",\n    required: \["return_points_won_pct", "service_points_won_pct"\],\n    compute: \(v\) => \{\n      const lost = 100 - v\["service_points_won_pct"\]!;\n      return lost > 0 \? v\["return_points_won_pct"\]! / lost : null;\n    \},\n    contextSensitive: true,\n  \},'''
          s2=re.sub(pattern,'',s,count=1)
          if s2==s: raise SystemExit('incorrect dominance-ratio spec not found')
          p.write_text(s2)

          # ---- imported alias catalog ----
          p=Path('src/lib/reconstruction/stat-catalog.ts')
          s=p.read_text()
          anchor='  P("historical_straight_set_win_pct","Historical straight-set win %","010"),\n];'
          if anchor not in s: raise SystemExit('imported alias anchor missing')
          extra='''  P("historical_straight_set_win_pct","Historical straight-set win %","010"),
  P("last5_win_pct","Last-5 win %","005"),
  P("last10_win_pct","Last-10 win %","005"),
  P("last5_set_win_pct","Last-5 set win %","005"),
  P("last10_set_win_pct","Last-10 set win %","005"),
  P("recent_straight_set_control_pct","Recent straight-set control %","005"),
  P("current_surface_recent_win_pct","Current-surface recent win %","005"),
  P("win_pct_60d","Win % last 60 days","005"),
  P("win_pct_90d","Win % last 90 days","005"),
  {key:"recent_form_trend",label:"Recent form trend",unit:"EDGE",family:"005",min:-100,max:100},
  {key:"surface_elo_trend",label:"Surface Elo trend",unit:"RATING",family:"001",min:-2000,max:2000},
  C("matches_last_7_days","Matches last 7 days","012",60),
  C("matches_last_14_days","Matches last 14 days","012",100),
  C("sets_last_14_days","Sets last 14 days","012",300),
  C("three_setters_last_14_days","Three-set matches last 14 days","012",50),
  {key:"rest_days",label:"Rest days",unit:"COUNT",family:"012",min:0,max:5000},
  {key:"recent_opponent_avg_elo",label:"Recent opponent average Elo",unit:"RATING",family:"006",min:500,max:3000},
  {key:"best_recent_win_opponent_elo",label:"Best recent win opponent Elo",unit:"RATING",family:"006",min:500,max:3000},
  P("bad_loss_rate_pct","Bad-loss rate %","006"),
  {key:"current_streak_signed",label:"Current W/L streak signed",unit:"COUNT",family:"068",min:-100,max:100},
  C("longest_win_streak_observed","Longest observed win streak","068",100),
  {key:"current_overall_elo",label:"Current overall Elo",unit:"RATING",family:"055",min:500,max:3000},
  {key:"career_observed_peak_elo",label:"Observed peak overall Elo",unit:"RATING",family:"055",min:500,max:3000},
  {key:"career_observed_low_elo",label:"Observed low overall Elo",unit:"RATING",family:"055",min:500,max:3000},
  {key:"elo_below_peak",label:"Overall Elo below peak",unit:"RATING",family:"055",min:-2000,max:2000},
  {key:"elo_change_last5",label:"Elo change last 5",unit:"RATING",family:"055",min:-2000,max:2000},
  {key:"elo_change_last10",label:"Elo change last 10",unit:"RATING",family:"055",min:-2000,max:2000},
  {key:"elo_change_last20",label:"Elo change last 20",unit:"RATING",family:"055",min:-2000,max:2000},
  {key:"elo_change_per_match_last20",label:"Elo change per match last 20",unit:"RATING",family:"055",min:-500,max:500},
  {key:"current_surface_elo",label:"Current surface Elo",unit:"RATING",family:"001",min:500,max:3000},
  {key:"observed_peak_surface_elo",label:"Observed peak surface Elo",unit:"RATING",family:"001",min:500,max:3000},
  {key:"surface_elo_below_peak",label:"Surface Elo below peak",unit:"RATING",family:"001",min:-2000,max:2000},
  {key:"surface_elo_change_last10",label:"Surface Elo change last 10",unit:"RATING",family:"001",min:-2000,max:2000},
  P("overall_recent20_win_pct","Recent-20 win %","005"),
  P("surface_win_pct_52w","Surface win % last 52 weeks","001"),
  C("surface_matches_52w","Surface matches last 52 weeks","001",500),
  {key:"recent_performance_acceleration",label:"Recent performance acceleration",unit:"EDGE",family:"005",min:-100,max:100},
  {key:"avg_sets_conceded_in_recent_wins",label:"Average sets conceded in recent wins",unit:"RATIO",family:"005",min:0,max:5},
  {key:"set_margin_mean",label:"Recent mean set margin",unit:"EDGE",family:"005",min:-5,max:5},
  {key:"performance_variance",label:"Performance dispersion proxy",unit:"RATIO",family:"011",min:0,max:10},
  P("deciding_match_reliance_pct","Deciding-match reliance %","011"),
  P("close_match_win_pct","Close-match win %","011"),
  {key:"recent_elo_delta_mean",label:"Recent Elo delta mean",unit:"RATING",family:"011",min:-1000,max:1000},
  {key:"recent_elo_delta_variance",label:"Recent Elo delta dispersion",unit:"RATING",family:"011",min:0,max:1000},
  {key:"recent_elo_best_delta",label:"Best recent Elo delta",unit:"RATING",family:"011",min:-1000,max:1000},
  {key:"recent_elo_worst_delta",label:"Worst recent Elo delta",unit:"RATING",family:"011",min:-1000,max:1000},
  {key:"floor_ceiling_elo_range",label:"Recent Elo floor-ceiling range",unit:"RATING",family:"011",min:0,max:2000},
  P("comparable_strength_win_pct","Comparable-strength win %","006"),
  P("upset_resistance_pct","Upset resistance %","011"),
  P("straight_set_rate_comparable_pct","Straight-set rate vs comparable strength","010"),
  C("qualifying_matches_last_14_days","Qualifying matches last 14 days","012",50),
  {key:"observed_vs_expected_wl_gap_pct",label:"Observed vs expected W/L gap",unit:"EDGE",family:"035",min:-100,max:100},
  P("performance_vs_comparable_strength_pct","Performance vs comparable strength %","006"),
  P("common_opponent_recency_weighted_win_pct","Common-opponent recency-weighted win %","007"),
  P("common_opponent_strength_weighted_win_pct","Common-opponent strength-weighted win %","007"),
  {key:"common_opponent_weighted_set_margin",label:"Common-opponent weighted set margin",unit:"EDGE",family:"007",min:-5,max:5},
  C("surface_matched_common_opponents","Surface-matched common opponents","007",500),
  P("matchup_expected_hold_pct","Matchup expected hold %","004"),
  P("matchup_expected_break_pct","Matchup expected break %","004"),
  {key:"expected_hold_break_differential",label:"Expected hold-break differential",unit:"EDGE",family:"004",min:-100,max:100},
  {key:"serve_vs_opponent_return_edge",label:"Serve vs opponent-return edge",unit:"EDGE",family:"023",min:-100,max:100},
  {key:"return_vs_opponent_serve_edge",label:"Return vs opponent-serve edge",unit:"EDGE",family:"023",min:-100,max:100},
  {key:"combined_point_efficiency",label:"Combined point efficiency",unit:"EDGE",family:"004",min:-100,max:100},
];'''
          s=s.replace(anchor,extra,1)
          p.write_text(s)

          # ---- regression tests ----
          p=Path('src/lib/reconstruction/stat-catalog.test.ts')
          s=p.read_text()
          insert='''\n  it("routes imported recent/strength/matchup aliases to their actual families",()=>{\n    expect(familyOf("last10_win_pct")).toBe("005");\n    expect(familyOf("recent_opponent_avg_elo")).toBe("006");\n    expect(familyOf("current_surface_elo")).toBe("001");\n    expect(familyOf("elo_change_last10")).toBe("055");\n    expect(familyOf("serve_vs_opponent_return_edge")).toBe("023");\n    expect(familyOf("matchup_expected_hold_pct")).toBe("004");\n    expect(familyOf("observed_vs_expected_wl_gap_pct")).toBe("035");\n  });\n'''
          idx=s.rfind('});')
          if idx<0: raise SystemExit('test suite close missing')
          s=s[:idx]+insert+s[idx:]
          p.write_text(s)

          Path('src/lib/reconstruction/master-definition.test.ts').write_text('''import { describe, expect, it } from "vitest";\nimport { RECONSTRUCTION_SPECS } from "./specs";\n\ndescribe("master metric formula guardrails",()=>{\n  it("does not reconstruct master Dominance Ratio from a single player's own serve loss rate",()=>{\n    expect(RECONSTRUCTION_SPECS.some(s=>s.output==="dominance_ratio")).toBe(false);\n  });\n});\n''')

      - name: Test and build
        run: |
          npx vitest run src/lib/reconstruction/stat-catalog.test.ts src/lib/reconstruction/master-definition.test.ts
          npm run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/hybrid-audit-research.server.ts src/lib/reconstruction/specs.ts src/lib/reconstruction/stat-catalog.ts src/lib/reconstruction/stat-catalog.test.ts src/lib/reconstruction/master-definition.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "Audit imported evidence wiring against master metrics"
          git push
