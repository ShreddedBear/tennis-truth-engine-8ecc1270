name: Sequential Metric Audit 007-011

on:
  push:
    branches: [metric-audit-007-011]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Metric regression tests
        run: bunx vitest run src/lib/common-opponent-enhanced.test.ts src/lib/audit-pipeline.test.ts src/lib/audit-research.test.ts src/lib/reconstruction/stat-catalog.test.ts
      - name: Build
        run: bun run build
