name: Sequential Metric Audit 007-011

on:
  push:
    branches: [metric-audit-007-011]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Full regression suite
        run: bunx vitest run
      - name: Build
        run: bun run build
