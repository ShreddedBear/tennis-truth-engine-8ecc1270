name: Task 18B PBP Score-State Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/pbp-score-state-recovery.ts'
      - 'src/lib/pbp-score-state-recovery.test.ts'
      - 'src/lib/deterministic-pbp-metrics.server.ts'
      - 'src/lib/bsd-atp-main-pbp.server.ts'
      - 'src/lib/bsd-wta-main-pbp.server.ts'
      - 'src/lib/bsd-atp-challenger-pbp.server.ts'
      - 'src/lib/bsd-wta-challenger-pbp.server.ts'
      - 'src/lib/metric-source-family-policy.ts'
      - 'scripts/task18b-pbp-recovery-audit.ts'
      - '.github/workflows/task18b-pbp-score-state-recovery.yml'
  push:
    branches: [repair/task18b-pbp-score-state-recovery]
    paths:
      - 'src/lib/pbp-score-state-recovery.ts'
      - 'src/lib/pbp-score-state-recovery.test.ts'
      - 'src/lib/deterministic-pbp-metrics.server.ts'
      - 'src/lib/bsd-atp-main-pbp.server.ts'
      - 'src/lib/bsd-wta-main-pbp.server.ts'
      - 'src/lib/bsd-atp-challenger-pbp.server.ts'
      - 'src/lib/bsd-wta-challenger-pbp.server.ts'
      - 'src/lib/metric-source-family-policy.ts'
      - 'scripts/task18b-pbp-recovery-audit.ts'
      - '.github/workflows/task18b-pbp-score-state-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task18b:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BSD_TENNIS_API_KEY: ${{ secrets.BSD_TENNIS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Task 18B deterministic reconstruction tests
        run: bunx vitest run src/lib/pbp-score-state-recovery.test.ts
      - name: Revalidate Tasks 1-16 identity and audit foundations
        run: bunx vitest run src/lib/evidence-player-alias.test.ts src/lib/evidence-match-identity.test.ts src/lib/audit-pipeline.test.ts
      - name: Verify BSD API secret
        run: test -n "$BSD_TENNIS_API_KEY"
      - name: Live four-tour PBP field and cell audit
        run: bun scripts/task18b-pbp-recovery-audit.ts | tee /tmp/task18b-live-audit.log
      - name: Production build/type integration
        run: bun run build
      - name: Upload Task 18B audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task18b-pbp-recovery-${{ github.run_id }}
          path: |
            /tmp/task18b-live-audit.log
            data/audit/task18b-pbp-recovery/summary.json
          if-no-files-found: warn
