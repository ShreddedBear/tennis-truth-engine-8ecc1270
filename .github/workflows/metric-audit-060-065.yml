name: Post-Fix Metric Wiring 060 062 063 064 065

on:
  push:
    branches:
      - audit/metrics-060-062-065-v5
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run five-metric post-fix regression tests
        run: bunx vitest run src/lib/metric-certification-060-065.test.ts

      - name: Run full regression suite
        run: bunx vitest run

      - name: Build app
        run: bun run build
