name: Phase 24 historical fallback repair
on:
  push:
    branches: [repair/evidence-coverage-phase24-historical-fallback]
    paths: ['.github/workflows/phase24-historical-fallback-patch.yml']
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/evidence-coverage-phase24-historical-fallback
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Patch provider-independent historical fallback into runtime diagnostic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/completion-sweep-research.server.ts')
          s=p.read_text()
          old='function historicalFinding(input:Parameters<Researcher["metrics"]>[0],metric:{code:string}):MetricFinding|null'
          new='export function completionSweepHistoricalFinding(input:{p1:string;p2:string;context:string},metric:{code:string}):MetricFinding|null'
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace('historicalFinding(input,m)', 'completionSweepHistoricalFinding(input,m)')
          p.write_text(s)

          p=Path('src/lib/evidence-coverage-runtime-diagnostic.server.ts')
          s=p.read_text()
          old='import { enforceFiveMetricWiring } from "./completion-sweep-research.server";'
          new='import { completionSweepHistoricalFinding, enforceFiveMetricWiring } from "./completion-sweep-research.server";'
          assert old in s
          s=s.replace(old,new,1)
          anchor='const certifiedLocalByCode=new Map(certifiedLocalRows.map(row=>[codeOf(row.metric_code),row]));'
          insert=anchor+'\n    const historicalLocalByCode=new Map(metrics.map(metric=>[codeOf(metric.code),completionSweepHistoricalFinding({p1:match.p1,p2:match.p2,context:match.context},metric)]));'
          assert anchor in s
          s=s.replace(anchor,insert,1)
          old='internal=certifiedLocalByCode.get(code)??null,p1Chosen=chooseEvidenceSide(p1Stored,local.row,internal,"p1"),p2Chosen=chooseEvidenceSide(p2Stored,local.row,internal,"p2");'
          new='internal=certifiedLocalByCode.get(code)??null,historicalInternal=historicalLocalByCode.get(code)??null,p1Internal=usableEvidenceSide(internal?.p1_treatment,internal?.p1_value)?internal:(usableEvidenceSide(historicalInternal?.p1_treatment,historicalInternal?.p1_value)?historicalInternal:(internal??historicalInternal)),p2Internal=usableEvidenceSide(internal?.p2_treatment,internal?.p2_value)?internal:(usableEvidenceSide(historicalInternal?.p2_treatment,historicalInternal?.p2_value)?historicalInternal:(internal??historicalInternal)),p1Chosen=chooseEvidenceSide(p1Stored,local.row,p1Internal,"p1"),p2Chosen=chooseEvidenceSide(p2Stored,local.row,p2Internal,"p2");'
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace('deterministic_family:local.row?.evidence_family??internal?.evidence_family??null,local_internal_p1:Boolean(internal?.p1_value),local_internal_p2:Boolean(internal?.p2_value),', 'deterministic_family:local.row?.evidence_family??internal?.evidence_family??historicalInternal?.evidence_family??null,local_internal_p1:Boolean(internal?.p1_value),local_internal_p2:Boolean(internal?.p2_value),historical_local_p1:Boolean(historicalInternal?.p1_value),historical_local_p2:Boolean(historicalInternal?.p2_value),',1)
          s=s.replace('schema_version:9', 'schema_version:10',1)
          s=s.replace('VERIFIED_INDEX_AND_CERTIFIED_LOCAL_FALLBACK', 'VERIFIED_INDEX_CERTIFIED_LOCAL_AND_COMPLETION_HISTORICAL_FALLBACK',1)
          p.write_text(s)
          PY
      - name: Add regression coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/evidence-coverage-runtime-diagnostic.test.ts')
          s=p.read_text()
          s=s.replace("expect(diagnostic).toContain('schema_version:9');", "expect(diagnostic).toContain('schema_version:10');")
          p.write_text(s)
          PY
          cat >> src/lib/evidence-coverage-runtime-diagnostic.test.ts <<'TS'

          describe("completion-sweep historical fallback bridge", () => {
            it("reuses only the provider-independent historical fallback in the runtime diagnostic", () => {
              expect(diagnostic).toContain("completionSweepHistoricalFinding");
              expect(diagnostic).toContain("historicalLocalByCode");
              expect(diagnostic).toContain("historical_local_p1");
              expect(diagnostic).toContain("schema_version:10");
            });
          });
          TS
      - name: Focused tests and build
        run: bunx vitest run src/lib/evidence-coverage-runtime-diagnostic.test.ts src/lib/metric-postfix-wiring-026-033.test.ts src/lib/protected-metric-wiring.test.ts && bun run build
      - name: Full regression suite
        run: bunx vitest run
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/completion-sweep-research.server.ts src/lib/evidence-coverage-runtime-diagnostic.server.ts src/lib/evidence-coverage-runtime-diagnostic.test.ts
          git commit -m 'Bridge certified historical completion fallback into coverage diagnostic'
          git push origin HEAD:repair/evidence-coverage-phase24-historical-fallback
