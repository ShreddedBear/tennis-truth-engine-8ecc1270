name: Temporary Evidence Phase20 Patch

on:
  push:
    branches: [repair/evidence-coverage-phase20-shared-context-buckets]
    paths: ['.github/workflows/tmp-evidence-phase20-patch.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/evidence-coverage-phase20-shared-context-buckets
      - name: Distinguish shared context from player evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          diagnostic = Path('src/lib/evidence-coverage-runtime-diagnostic.server.ts')
          text = diagnostic.read_text()
          old = 'else if((entry?.observations?.length??0)>0&&entry?.direct_satisfaction_allowed){bucket="EVIDENCE_WIRING_FAILURE";reason="Sufficient admissible observations exist but did not become a usable deterministic/stored finding.";}else if((entry?.observations?.length??0)>0){bucket="RECONSTRUCTION_FAILURE";reason="Support-only admissible observations exist but no permitted deterministic reconstruction recovered the metric.";}else if(policy.allowed_families.length){'
          new = 'else if((entry?.observations?.length??0)>0&&policy.allowed_families.includes("RESULTS_SCHEDULE")&&!(entry.observations??[]).some((o:any)=>Boolean(o?.player))){bucket="INGESTION_MISSING";reason="Only shared tournament/schedule context is present; player-specific match evidence required by this metric has not been ingested.";}else if((entry?.observations?.length??0)>0&&entry?.direct_satisfaction_allowed){bucket="EVIDENCE_WIRING_FAILURE";reason="Sufficient admissible observations exist but did not become a usable deterministic/stored finding.";}else if((entry?.observations?.length??0)>0){bucket="RECONSTRUCTION_FAILURE";reason="Support-only admissible observations exist but no permitted deterministic reconstruction recovered the metric.";}else if(policy.allowed_families.length){'
          if old not in text: raise SystemExit('expected diagnostic classification chain not found')
          diagnostic.write_text(text.replace(old,new,1))

          test = Path('src/lib/evidence-coverage-runtime-diagnostic.test.ts')
          text = test.read_text()
          anchor = '  it("prevents dense market/PBP rows from crowding other evidence families", () => {'
          addition = '''  it("classifies shared-only schedule context as ingestion missing rather than reconstruction failure", () => {\n    expect(diagnostic).toContain('policy.allowed_families.includes("RESULTS_SCHEDULE")');\n    expect(diagnostic).toContain('!(entry.observations??[]).some((o:any)=>Boolean(o?.player))');\n    expect(diagnostic).toContain('Only shared tournament/schedule context is present; player-specific match evidence required by this metric has not been ingested.');\n  });\n\n'''
          if anchor not in text: raise SystemExit('expected diagnostic test anchor not found')
          test.write_text(text.replace(anchor,addition+anchor,1))
          PY
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/evidence-coverage-runtime-diagnostic.server.ts src/lib/evidence-coverage-runtime-diagnostic.test.ts
          git commit -m 'Classify shared-only schedule gaps as ingestion missing'
          git push origin HEAD:repair/evidence-coverage-phase20-shared-context-buckets
