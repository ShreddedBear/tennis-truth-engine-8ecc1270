name: Evidence Coverage Phase 21 CI Trigger
on:
  push:
    branches: [repair/evidence-coverage-phase21-index-sampling]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run src/lib/evidence-index-match-sampler.test.ts src/lib/evidence-coverage-runtime-diagnostic.test.ts
      - run: npm run build --if-present
