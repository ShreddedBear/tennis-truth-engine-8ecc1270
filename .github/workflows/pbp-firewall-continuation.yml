name: ATP Challenger PBP Firewall Continuation

on:
  workflow_dispatch:
    inputs:
      max_batches:
        description: Maximum Challenger year batches to process this run
        required: false
        default: '10'
      through_year:
        description: Last Challenger year to process (defaults to current UTC year)
        required: false
        default: ''
      force_recheck:
        description: Re-run completed Challenger batches without weakening firewalls
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'ci-trigger-challenger-pbp-firewall.txt'
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  CHALLENGER_MAX_BATCHES: ${{ inputs.max_batches || '10' }}
  CHALLENGER_THROUGH_YEAR: ${{ inputs.through_year || '' }}
  CHALLENGER_FORCE_RECHECK: ${{ inputs.force_recheck || 'false' }}

concurrency:
  group: atp-challenger-pbp-firewall-continuation
  cancel-in-progress: false

jobs:
  continue-atp-challenger-pbp:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verifier dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas openpyxl xlrd requests

      - name: Challenger-only safety gate
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/challenger-pbp-firewall-queue.py
          test -f scripts/verify-challenger-pbp.py
          test -f scripts/audit-challenger-verified-mappings-v2.py
          python -m py_compile scripts/challenger-pbp-firewall-queue.py scripts/verify-challenger-pbp.py scripts/audit-challenger-verified-mappings-v2.py
          if grep -E '^\s*python .*verify-sackmann-pbp' .github/workflows/pbp-firewall-continuation.yml; then
            echo 'SAFETY FAILURE: Challenger workflow executes a main-tour PBP verifier.' >&2
            exit 97
          fi

      - name: Continue Challenger queue from checkpoint
        id: queue
        shell: bash
        run: |
          set -euo pipefail
          args=(--max-batches "${CHALLENGER_MAX_BATCHES}")
          if [[ -n "${CHALLENGER_THROUGH_YEAR}" ]]; then args+=(--through-year "${CHALLENGER_THROUGH_YEAR}"); fi
          if [[ "${CHALLENGER_FORCE_RECHECK}" == "true" ]]; then args+=(--force-recheck); fi
          python scripts/challenger-pbp-firewall-queue.py "${args[@]}" | tee /tmp/challenger-pbp-firewall-run.log
          COMPLETE=$(grep -E '^CHALLENGER_QUEUE_COMPLETE=' /tmp/challenger-pbp-firewall-run.log | tail -1 | cut -d= -f2 || true)
          echo "complete=${COMPLETE:-false}" >> "$GITHUB_OUTPUT"

      - name: Run Challenger global contamination firewall
        run: python scripts/challenger-pbp-firewall-queue.py --audit-only

      - name: Strict v2 validity re-audit
        id: validity
        shell: bash
        run: |
          set -o pipefail
          python scripts/audit-challenger-verified-mappings-v2.py | tee /tmp/challenger-validity-v2.log

      - name: Commit Challenger checkpoints only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audit/verified-pbp/atp_challenger 2>/dev/null || true
          git add data/audit/challenger-pbp-firewall-queue 2>/dev/null || true
          if git diff --cached --quiet; then echo "No new Challenger checkpoint work to commit."; exit 0; fi
          git commit -m "Continue ATP Challenger verified PBP firewall queue"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload Challenger run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: challenger-pbp-firewall-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            /tmp/challenger-pbp-firewall-run.log
            /tmp/challenger-validity-v2.log
            data/audit/challenger-pbp-firewall-queue/
            data/audit/verified-pbp/atp_challenger/

      - name: Challenger status updates
        if: always()
        shell: bash
        run: |
          {
            echo "## ATP Challenger PBP Firewall"
            echo
            echo "**ATP Challenger ONLY. No ATP Main/WTA Main execution or staging.**"
            echo
            if [[ -f data/audit/challenger-pbp-firewall-queue/summary.md ]]; then cat data/audit/challenger-pbp-firewall-queue/summary.md; fi
            echo
            echo "### Strict validity re-audit"
            if [[ -f data/audit/challenger-pbp-firewall-queue/validity-reaudit-v2-summary.md ]]; then cat data/audit/challenger-pbp-firewall-queue/validity-reaudit-v2-summary.md; fi
            echo
            if [[ "${{ steps.queue.outputs.complete }}" == "true" ]]; then echo "**Requested Challenger queue is complete, subject to strict v2 certification status above.**"; else echo "**Challenger queue remains active and will resume on the next scheduled run.**"; fi
          } >> "$GITHUB_STEP_SUMMARY"
