name: Phase 27 WTA match ingestion CI

on:
  push:
    branches:
      - repair/evidence-coverage-phase27-wta-match-probe
    paths:
      - 'src/lib/ingestion/wta-official-match-results.server.ts'
      - 'src/lib/ingestion/orchestrator.server.ts'
      - 'src/lib/ingestion/tour-results-schedule.test.ts'
      - '.github/workflows/phase27-wta-match-ingestion-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Ingestion regression tests
        run: npx vitest run src/lib/ingestion/tour-results-schedule.test.ts src/lib/ingestion/orchestrator-validation.test.ts
      - name: Full regression suite
        run: npx vitest run
      - name: Production build
        run: npm run build
