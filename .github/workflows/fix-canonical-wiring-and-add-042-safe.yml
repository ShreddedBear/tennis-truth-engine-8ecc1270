name: Fix Canonical Wiring And Add 042 Safe
on:
  push:
    paths:
      - '.github/workflows/fix-canonical-wiring-and-add-042-safe.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch canonical routing and 042
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/lib/reconstruction/stat-catalog.ts')
          s=p.read_text()
          old='export const STAT_BY_KEY=new Map(STAT_CATALOG.map(s=>[s.key,s]));\nexport function familyOf(key:string):string|null{return STAT_BY_KEY.get(key)?.family??null;}'
          new='''export const STAT_BY_KEY=new Map(STAT_CATALOG.map(s=>[s.key,s]));
const FAMILY_OVERRIDES:Record<string,string>={
  same_tournament_matches:"030",same_tournament_win_pct:"030",
  same_round_matches:"028",same_round_win_pct:"028",
  same_level_matches:"020",same_level_win_pct:"020",
  match_surface_hard:"021",match_surface_clay:"021",match_surface_grass:"021",match_surface_carpet:"021",match_indoor:"021",
  verified_court_speed_index:"021",verified_court_speed_band:"021",
  match_temperature_c:"021",match_humidity_pct:"021",match_wind_kph:"021",match_altitude_m:"021",match_roof_closed:"021",
  serve_aggression_proxy:"023",serve_reliance_proxy:"023",return_pressure_proxy:"023",balanced_efficiency_proxy:"023",close_match_resilience_proxy:"023",
  style_serve_vs_return_edge:"023",style_return_vs_serve_edge:"023",style_balance_edge:"023",style_resilience_edge:"023",
};
export function familyOf(key:string):string|null{return FAMILY_OVERRIDES[key]??STAT_BY_KEY.get(key)?.family??null;}'''
          if old not in s: raise SystemExit('stat catalog tail anchor not found')
          p.write_text(s.replace(old,new,1))

          Path('src/lib/reconstruction/stat-catalog.test.ts').write_text('''import { describe, expect, it } from "vitest";\nimport { familyOf } from "./stat-catalog";\n\ndescribe("canonical imported-stat family routing",()=>{\n  it("routes event history correctly",()=>{expect(familyOf("same_tournament_win_pct")).toBe("030");expect(familyOf("same_round_win_pct")).toBe("028");expect(familyOf("same_level_win_pct")).toBe("020");});\n  it("routes environment to 021",()=>{for(const key of ["match_surface_hard","verified_court_speed_index","match_temperature_c","match_wind_kph"])expect(familyOf(key)).toBe("021");});\n  it("routes style proxies to matchup-adjusted 023",()=>{for(const key of ["serve_aggression_proxy","style_serve_vs_return_edge","style_resilience_edge"])expect(familyOf(key)).toBe("023");});\n  it("blocks imported proxies from 015-018",()=>{for(const key of ["same_tournament_win_pct","same_round_win_pct","same_level_win_pct","match_surface_hard","match_temperature_c","serve_aggression_proxy","style_serve_vs_return_edge"])expect(["015","016","017","018"]).not.toContain(familyOf(key));});\n});\n''')

          p=Path('src/lib/meta-derived-evidence.server.ts')
          s=p.read_text()
          if 'applyOpponentWinPathwaysMetric' not in s:
            s += '''\n\nexport async function applyOpponentWinPathwaysMetric(deps: PipelineDeps, runId: string, player1: string, player2: string) {\n  const metrics=await deps.list("metric_results",runId);\n  const target=metrics.find((row)=>codeOf(row)==="042");\n  if(!target)return false;\n  const pathways=await deps.list("underdog_results",runId);\n  const completed=pathways.filter((row)=>String(row["status"]??"")==="COMPLETE"&&["WEAK","REALISTIC","STRONG"].includes(String(row["classification"]??"")));\n  if(!completed.length)return false;\n  const bySide=(side:string)=>completed.filter((row)=>String(row["player_side"]??"")===side);\n  const summarize=(rows:Array<Record<string,unknown>>)=>rows.map((row)=>`${String(row["pathway_code"]??"")}:${String(row["classification"]??"")}`).join("; ");\n  const p1OpponentRows=bySide(player2),p2OpponentRows=bySide(player1);\n  const p1Value=p1OpponentRows.length?`opponent_win_pathway_classifications=${summarize(p1OpponentRows)}`:null;\n  const p2Value=p2OpponentRows.length?`opponent_win_pathway_classifications=${summarize(p2OpponentRows)}`:null;\n  if(!p1Value&&!p2Value)return false;\n  const same=String(target["p1_value"]??"")===String(p1Value??"")&&String(target["p2_value"]??"")===String(p2Value??"")&&String(target["p1_treatment"]??"")===(p1Value?"PARTIAL":"UNAVAILABLE")&&String(target["p2_treatment"]??"")===(p2Value?"PARTIAL":"UNAVAILABLE");\n  if(same)return false;\n  const now=deps.now().toISOString();\n  await deps.update("metric_results",String(target["id"]),{p1_value:p1Value,p2_value:p2Value,p1_treatment:p1Value?"PARTIAL":"UNAVAILABLE",p2_treatment:p2Value?"PARTIAL":"UNAVAILABLE",p1_status:p1Value?"COMPLETE":"UNAVAILABLE",p2_status:p2Value?"COMPLETE":"UNAVAILABLE",status:p1Value||p2Value?"COMPLETE":"UNAVAILABLE",evidence_family:null,reliability:70,sample:String(completed.length),sources:[],source_attempts:[],reconstruction_attempted:true,reconstruction_reason:"Derived from completed Dangerous Underdog pathway classifications for the opposing player. The persisted audit stores pathway classifications, not calibrated pathway probabilities, so metric 042 remains PARTIAL.",reconstruction_result:`P1: ${p1Value??"UNAVAILABLE"} | P2: ${p2Value??"UNAVAILABLE"}`,retrieved_at:now,p1_retrieved_at:now,p2_retrieved_at:now,p1_unavailable_reason:p1Value?"MISSING_REQUIRED_INPUT":"NO_SOURCE_FOUND",p2_unavailable_reason:p2Value?"MISSING_REQUIRED_INPUT":"NO_SOURCE_FOUND",unavailable_reason:"MISSING_REQUIRED_INPUT",unavailable_detail:"PARTIAL only: classifications exist, but calibrated opponent-win-pathway probabilities required by metric 042 are not persisted and are not fabricated.",missing_inputs:["calibrated probability for each opponent win pathway"]});\n  return true;\n}\n'''
          p.write_text(s)

          p=Path('src/lib/audit-pipeline.functions.ts')
          s=p.read_text()
          old='''      const { applyStressDerivedMetrics } = await import("./stress-derived-evidence.server");\n      const changed = await applyStressDerivedMetrics(deps, runId);'''
          new='''      const { applyStressDerivedMetrics } = await import("./stress-derived-evidence.server");\n      const { applyOpponentWinPathwaysMetric } = await import("./meta-derived-evidence.server");\n      const stressChanged = await applyStressDerivedMetrics(deps, runId);\n      const underdogDone = stages.find((s) => s.stage === "DANGEROUS UNDERDOG AUDIT")?.status === "COMPLETE";\n      const match = underdogDone ? await deps.getMatch(data.matchId) : null;\n      const pathwayChanged = underdogDone && match ? await applyOpponentWinPathwaysMetric(deps, runId, match.player1_name, match.player2_name) : false;\n      const changed = stressChanged || pathwayChanged;'''
          if old not in s: raise SystemExit('stress/meta integration anchor not found')
          p.write_text(s.replace(old,new,1))
      - name: Test and build
        run: |
          npx vitest run src/lib/reconstruction/stat-catalog.test.ts
          npm run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/reconstruction/stat-catalog.ts src/lib/reconstruction/stat-catalog.test.ts src/lib/meta-derived-evidence.server.ts src/lib/audit-pipeline.functions.ts
          git diff --cached --quiet && exit 0
          git commit -m "Fix canonical imported-data wiring and add partial opponent pathways"
          git push
