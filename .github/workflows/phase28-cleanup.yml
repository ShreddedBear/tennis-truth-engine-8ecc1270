name: Phase 28 cleanup temporary workflows

on:
  push:
    branches:
      - repair/evidence-coverage-phase28-wta-network
    paths:
      - '.github/workflows/phase28-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/evidence-coverage-phase28-wta-network
      - name: Remove temporary Phase 28 workflows
        run: |
          rm -f .github/workflows/phase28-wire-wta-network.yml
          rm -f .github/workflows/phase28-validate-wta-network.yml
          rm -f .github/workflows/phase28-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows
          git commit -m 'Remove temporary Phase 28 workflows'
          git push origin HEAD:repair/evidence-coverage-phase28-wta-network
