name: Expand Honest Evidence
on:
  push:
    paths:
      - '.github/workflows/expand-honest-evidence.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add defensible historical reconstructions
        shell: python
        run: |
          from pathlib import Path

          # 1) Add explicit false-form gap to ranking/performance stats.
          p=Path('src/lib/ranking-performance.server.ts')
          s=p.read_text()
          anchor='  add("favorite_fragility_strength_gap",peak!==null&&cur!==null?peak-cur:null,by.get("career_observed_peak_elo")?.sample??0);\n'
          insert='  add("observed_vs_expected_wl_gap_pct",form20!==null&&comp!==null?form20-comp:null,Math.min(by.get("overall_recent20_win_pct")?.sample??0,by.get("comparable_strength_win_pct")?.sample??0));\n'
          if insert not in s:
              if anchor not in s: raise SystemExit('ranking anchor not found')
              s=s.replace(anchor,anchor+insert)
          p.write_text(s)

          # 2) Add signed current streak + longest win streak from pre-match chronology.
          p=Path('src/lib/predixsport-recent.server.ts')
          s=p.read_text()
          anchor=' const ownCurrent=current; if(ownCurrent!==null){let bad=0,eligible=0;for(const r of last10.filter(r=>r.won==="0")){const oe=latestOpponentElo(all,r.opponent??"",r.date??"",surf);if(oe!==null){eligible++;if(oe<=ownCurrent-100)bad++;}}if(eligible)add("bad_loss_rate_pct",100*bad/eligible,eligible);}\n'
          extra=''' const seq=rows.map(r=>r.won).filter(x=>x==="0"||x==="1");if(seq.length){const last=seq[seq.length-1],sign=last==="1"?1:-1;let streak=0;for(let i=seq.length-1;i>=0&&seq[i]===last;i--)streak++;add("current_streak_signed",sign*streak,seq.length);let best=0,run=0;for(const x of seq){if(x==="1"){run++;best=Math.max(best,run);}else run=0;}add("longest_win_streak_observed",best,seq.length);}\n'''
          if extra not in s:
              if anchor not in s: raise SystemExit('recent anchor not found')
              s=s.replace(anchor,anchor+extra)
          p.write_text(s)

          # 3) Expose only semantically matching stats to later metric families.
          p=Path('src/lib/hybrid-audit-research.server.ts')
          s=p.read_text()
          target='if(f==="030")value=summarize(map,["same_tournament_matches","same_tournament_win_pct","verified_court_speed_index","verified_court_speed_band"]);if(!value)return null;'
          replacement='''if(f==="030")value=summarize(map,["same_tournament_matches","same_tournament_win_pct","verified_court_speed_index","verified_court_speed_band"]);if(f==="035")value=summarize(map,["observed_vs_expected_wl_gap_pct","overall_recent20_win_pct","performance_vs_comparable_strength_pct","recent_form_strength_signal"]);if(f==="055")value=summarize(map,["elo_change_last5","elo_change_last10","elo_change_last20","elo_change_per_match_last20","surface_elo_change_last10","recent_performance_acceleration","recent_form_trend"]);if(f==="068")value=summarize(map,["current_streak_signed","longest_win_streak_observed"]);if(f==="080")value=summarize(map,["recent_opponent_avg_elo","best_recent_win_opponent_elo","bad_loss_rate_pct","comparable_strength_win_pct","performance_vs_comparable_strength_pct","common_opponent_strength_weighted_win_pct","common_opponent_recency_weighted_win_pct"]);if(!value)return null;'''
          if target not in s: raise SystemExit('hybrid expansion anchor not found')
          s=s.replace(target,replacement)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/ranking-performance.server.ts src/lib/predixsport-recent.server.ts src/lib/hybrid-audit-research.server.ts
          git diff --cached --quiet && exit 0
          git commit -m "Expand evidence with defensible historical reconstructions"
          git push
