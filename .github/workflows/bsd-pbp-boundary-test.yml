name: BSD PBP Historical Boundary Test

# Persist non-secret BSD boundary results to the repository so they remain readable after each run.
# Queue continuation run at 2026-08-23T21:03Z; no verification logic changed.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bsd-pbp-boundary-test.yml'
      - 'scripts/bsd-pbp-boundary-test.py'

permissions:
  contents: write

jobs:
  boundary-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BSD_TENNIS_API_KEY: ${{ secrets.BSD_TENNIS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify secret is configured without exposing it
        shell: bash
        run: |
          if [ -z "$BSD_TENNIS_API_KEY" ]; then
            echo 'BSD_TENNIS_API_KEY is not available to this workflow.'
            exit 1
          fi
          echo 'BSD_TENNIS_API_KEY is available (value intentionally hidden).'
      - name: Test actual BSD historical point-by-point responses
        run: python3 scripts/bsd-pbp-boundary-test.py
      - name: Show non-secret summary
        if: always()
        run: |
          if [ -f artifacts/bsd-pbp-boundary/summary.md ]; then cat artifacts/bsd-pbp-boundary/summary.md; fi
      - name: Persist non-secret results to repository
        if: success()
        shell: bash
        run: |
          mkdir -p data/audit/bsd-pbp-boundary
          cp artifacts/bsd-pbp-boundary/summary.md data/audit/bsd-pbp-boundary/summary.md
          cp artifacts/bsd-pbp-boundary/summary.json data/audit/bsd-pbp-boundary/summary.json
          cp artifacts/bsd-pbp-boundary/results.json data/audit/bsd-pbp-boundary/results.json
          date -u +'%Y-%m-%dT%H:%M:%SZ' > data/audit/bsd-pbp-boundary/LAST_RUN_UTC.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/audit/bsd-pbp-boundary
          if git diff --cached --quiet; then
            echo 'BSD boundary report unchanged.'
          else
            git commit -m 'Persist BSD PBP historical boundary results'
            git push
          fi
      - name: Upload boundary-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsd-pbp-boundary-results
          path: artifacts/bsd-pbp-boundary/
          if-no-files-found: warn
