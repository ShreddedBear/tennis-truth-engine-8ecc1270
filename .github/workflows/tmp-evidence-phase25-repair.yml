name: Temporary Evidence Coverage Phase 25 Repair

on:
  push:
    branches: [repair/evidence-coverage-phase25-current-sampling]
    paths: ['.github/workflows/tmp-evidence-phase25-repair.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Patch current-snapshot sampling and context hydration
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/lib/evidence-coverage-runtime-diagnostic.server.ts')
          s=p.read_text()
          s=s.replace('type PersistedPairCandidate = { player_name:string|null; opponent_name:string|null; as_of_date:string|null };','type PersistedPairCandidate = { player_name:string|null; opponent_name:string|null; as_of_date:string|null; metric_code:string|null; value_text:string|null; evidence_family:string|null };')
          old='''function persistedPairRepresentative(id:RepresentativeId,row:PersistedPairCandidate,index:number):RepresentativeMatch {\n  const date=row.as_of_date!,level=id.replaceAll("_"," "),tournament=`${id} persisted evidence pair`;\n  return {id,match_id:`metric-evidence:${id}:${index}`,p1:row.player_name!,p2:row.opponent_name!,date,date_source:"persisted_as_of_date",tournament,context:[`Evidence sample: persisted metric pair`,`Level: ${level}`,`Tour: ${level}`,`Date: ${date}`].join(" | "),event_level:level,surface:null,sampling_source:"metric_evidence_store"};\n}\n'''
          new='''function persistedSurface(rows:PersistedPairCandidate[]){for(const row of rows){if(codeOf(row.metric_code)!=="021")continue;const m=String(row.value_text??"").match(/match_surface_(hard|clay|grass|carpet)=1(?:\\.0+)?/i);if(m)return m[1].toLowerCase();}return null;}\nfunction persistedPairRepresentative(id:RepresentativeId,rows:PersistedPairCandidate[],index:number):RepresentativeMatch {\n  const row=rows[0],date=row.as_of_date!,level=id.replaceAll("_"," "),tournament=`${id} persisted evidence snapshot`,surface=persistedSurface(rows);\n  const metricCount=new Set(rows.map(r=>codeOf(r.metric_code)).filter(Boolean)).size;\n  return {id,match_id:`metric-evidence:${id}:${index}`,p1:row.player_name!,p2:row.opponent_name!,date,date_source:"persisted_as_of_date",tournament,context:[`Evidence sample: persisted metric pair`,`Persisted metrics: ${metricCount}`,`Level: ${level}`,`Tour: ${level}`,surface?`Surface: ${surface}`:null,`Date: ${date}`].filter(Boolean).join(" | "),event_level:level,surface,sampling_source:"metric_evidence_store"};\n}\n'''
          if old not in s: raise SystemExit('persisted representative anchor missing')
          s=s.replace(old,new,1)
          # Remove the Phase 24 pre-persisted verified-index priority block only.
          start='''  // Prefer a real, strictly classified verified-index match before synthetic persisted-pair sampling.\n  // This keeps representative validation tied to an actual match and also survives deployments that omit data/ files.\n  if(missing().length){\n    for(const id of missing()){\n      const row=await sampleVerifiedEvidenceIndexMatch(id);\n      if(!row)continue;\n      const level=id.replaceAll("_"," ");\n      selected.push({id,match_id:row.match_id,p1:row.p1,p2:row.p2,date:row.date,date_source:"verified_index_date",tournament:row.tournament,context:[`Tournament: ${row.tournament}`,`Level: ${level}`,`Tour: ${level}`,row.surface?`Surface: ${row.surface}`:null,`Date: ${row.date}`].filter(Boolean).join(" | "),event_level:level,surface:row.surface,sampling_source:"verified_pbp_index"});\n    }\n  }\n'''
          if start not in s: raise SystemExit('Phase24 priority block missing')
          s=s.replace(start,'',1)
          oldpersist='''  if(missing().some(id=>id==="ATP_MAIN"||id==="WTA_MAIN")){\n    const persisted=await db.from("metric_evidence_store").select("player_name,opponent_name,as_of_date").not("player_name","is",null).not("opponent_name","is",null).not("as_of_date","is",null).order("as_of_date",{ascending:false}).limit(1000);\n    if(!persisted.error){\n      const seenPairs=new Set<string>();\n      const rows=((persisted.data??[]) as PersistedPairCandidate[]).filter(row=>{const p1=String(row.player_name??"").trim(),p2=String(row.opponent_name??"").trim(),date=String(row.as_of_date??"").trim();if(!p1||!p2||!date||p1===p2)return false;const key=`${[p1,p2].sort().join("|")}|${date}`;if(seenPairs.has(key))return false;seenPairs.add(key);return true;});\n      for(let index=0;index<rows.length&&missing().some(id=>id==="ATP_MAIN"||id==="WTA_MAIN");index++){const row=rows[index];const inferred=await classifyPairFromExactRankingEvidence(row.player_name!,row.opponent_name!);if(inferred&&missing().includes(inferred))selected.push(persistedPairRepresentative(inferred,row,index));}\n    }\n  }\n'''
          newpersist='''  // Current persisted evidence snapshots are the primary coverage sample for main tours.\n  // Real verified-index matches are retained separately below as independent class proof and as the fallback when no current snapshot exists.\n  if(missing().some(id=>id==="ATP_MAIN"||id==="WTA_MAIN")){\n    const persisted=await db.from("metric_evidence_store").select("player_name,opponent_name,as_of_date,metric_code,value_text,evidence_family").not("player_name","is",null).not("opponent_name","is",null).not("as_of_date","is",null).order("as_of_date",{ascending:false}).limit(2000);\n    if(!persisted.error){\n      const grouped=new Map<string,PersistedPairCandidate[]>();\n      for(const row of ((persisted.data??[]) as PersistedPairCandidate[])){const p1=String(row.player_name??"").trim(),p2=String(row.opponent_name??"").trim(),date=String(row.as_of_date??"").trim();if(!p1||!p2||!date||p1===p2)continue;const key=`${[p1,p2].sort().join("|")}|${date}`;const group=grouped.get(key)??[];group.push(row);grouped.set(key,group);}\n      const groups=[...grouped.values()].sort((a,b)=>{const ad=String(a[0]?.as_of_date??""),bd=String(b[0]?.as_of_date??"");if(ad!==bd)return bd.localeCompare(ad);const ac=new Set(a.map(r=>codeOf(r.metric_code))).size,bc=new Set(b.map(r=>codeOf(r.metric_code))).size;return bc-ac;});\n      for(let index=0;index<groups.length&&missing().some(id=>id==="ATP_MAIN"||id==="WTA_MAIN");index++){const group=groups[index],row=group[0];const inferred=await classifyPairFromExactRankingEvidence(row.player_name!,row.opponent_name!);if(inferred&&missing().includes(inferred))selected.push(persistedPairRepresentative(inferred,group,index));}\n    }\n  }\n'''
          if oldpersist not in s: raise SystemExit('persisted sampling block missing')
          s=s.replace(oldpersist,newpersist,1)
          # Add independent verified class proof before return.
          oldret='''  const missingClasses=missing(),missing_class_reasons:Partial<Record<RepresentativeId,string>>={};\n  for(const id of missingClasses)missing_class_reasons[id]=`No real persisted ${id} match, qualifying paired warehouse observation, or ranking-proven persisted metric-evidence pair was available for diagnostic sampling.`;\n  return {matches:selected,missing_classes:missingClasses,missing_class_reasons};\n}\n'''
          newret='''  const class_proof:Partial<Record<RepresentativeId,unknown>>={};\n  for(const id of wanted){const proof=await sampleVerifiedEvidenceIndexMatch(id);if(proof)class_proof[id]={match_id:proof.match_id,pair:`${proof.p1} vs ${proof.p2}`,date:proof.date,tournament:proof.tournament,surface:proof.surface};}\n  const missingClasses=missing(),missing_class_reasons:Partial<Record<RepresentativeId,string>>={};\n  for(const id of missingClasses)missing_class_reasons[id]=`No real persisted ${id} match, qualifying paired warehouse observation, ranking-proven current evidence snapshot, or verified PBP index match was available for diagnostic sampling.`;\n  return {matches:selected,missing_classes:missingClasses,missing_class_reasons,class_proof};\n}\n'''
          if oldret not in s: raise SystemExit('representative return block missing')
          s=s.replace(oldret,newret,1)
          s=s.replace('missing_class_reasons:sample.missing_class_reasons},matches};','missing_class_reasons:sample.missing_class_reasons,class_proof:sample.class_proof},matches};')
          p.write_text(s)

          t=Path('src/lib/evidence-coverage-runtime-diagnostic.test.ts')
          ts=t.read_text()
          oldtest='''  it("prefers deployment-safe verified match samples before synthetic persisted-pair fallback", () => {\n    expect(diagnostic).toContain("Prefer a real, strictly classified verified-index match before synthetic persisted-pair sampling.");\n    const verifiedPriority = diagnostic.indexOf('const row=await sampleVerifiedEvidenceIndexMatch(id);');\n    const persistedFallback = diagnostic.indexOf('const persisted=await db.from("metric_evidence_store")');\n    expect(verifiedPriority).toBeGreaterThan(-1);\n    expect(persistedFallback).toBeGreaterThan(verifiedPriority);\n  });\n'''
          newtest='''  it("separates current evidence coverage sampling from verified historical class proof", () => {\n    expect(diagnostic).toContain("Current persisted evidence snapshots are the primary coverage sample for main tours.");\n    expect(diagnostic).toContain('select("player_name,opponent_name,as_of_date,metric_code,value_text,evidence_family")');\n    expect(diagnostic).toContain("persistedSurface(rows)");\n    expect(diagnostic).toContain("class_proof");\n    const persistedPriority = diagnostic.indexOf('const persisted=await db.from("metric_evidence_store")');\n    const verifiedFallback = diagnostic.indexOf('const row=await sampleVerifiedEvidenceIndexMatch(id);', persistedPriority);\n    expect(persistedPriority).toBeGreaterThan(-1);\n    expect(verifiedFallback).toBeGreaterThan(persistedPriority);\n  });\n'''
          if oldtest not in ts: raise SystemExit('old priority test missing')
          ts=ts.replace(oldtest,newtest,1)
          ts=ts.replace('expect(diagnostic).toContain(\'from("metric_evidence_store").select("player_name,opponent_name,as_of_date")\');','expect(diagnostic).toContain(\'from("metric_evidence_store").select("player_name,opponent_name,as_of_date,metric_code,value_text,evidence_family")\');')
          ts=ts.replace('expect(diagnostic).toContain("seenPairs");','expect(diagnostic).toContain("grouped=new Map");\n    expect(diagnostic).toContain("persistedSurface");')
          t.write_text(ts)
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Targeted Evidence Coverage tests
        run: bunx vitest run src/lib/evidence-coverage-runtime-diagnostic.test.ts src/lib/evidence-index-match-sampler.test.ts
      - name: Full regression suite
        run: bunx vitest run
      - name: Production build
        run: bun run build
      - name: Commit Phase 25 repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/evidence-coverage-runtime-diagnostic.server.ts src/lib/evidence-coverage-runtime-diagnostic.test.ts
          git commit -m 'Separate current coverage sampling from verified class proof'
          git push
