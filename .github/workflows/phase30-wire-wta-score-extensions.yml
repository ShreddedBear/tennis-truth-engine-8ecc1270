          newmap='const common=commonOpponentPair(a,b,asOfDate),extendedCommon=extendedCommonOpponentValue(a,b,asOfDate);return args.metrics.map(metric=>{const code=codeOf(metric.code);if(!SUPPORTED.has(code))return buildTrustedInternalFinding({metric_code:metric.code,players:{p1:args.p1,p2:args.p2},p1:null,p2:null,evidence_family:null,reliability:90,unavailable_reason:"Official WTA match history is not an allowed source for this metric family",persistedSources:[]});const av=code==="007"?common?.p1??null:code==="031"?extendedCommon?.p1??null:(sa?metricValue(code,sa):null)??extendedSideMetricValue(code,a,asOfDate),bv=code==="007"?common?.p2??null:code==="031"?extendedCommon?.p2??null:(sb?metricValue(code,sb):null)??extendedSideMetricValue(code,b,asOfDate);const sources=[...(sa?refs(sa.sourceUrls):[]),...(sb?refs(sb.sourceUrls):[])].filter((s,i,x)=>x.findIndex(v=>v.url===s.url)===i);const sample=code==="007"?common?.sample??null:code==="031"?extendedCommon?.sample??null:null;return buildTrustedInternalFinding({metric_code:metric.code,players:{p1:args.p1,p2:args.p2},p1:av?{player:args.p1,value:av,treatment:"PARTIAL",sample:sample??sa?.matches??null,sources:sa?refs(sa.sourceUrls):[]}:null,p2:bv?{player:args.p2,value:bv,treatment:"PARTIAL",sample:sample??sb?.matches??null,sources:sb?refs(sb.sourceUrls):[]}:null,evidence_family:code==="007"||code==="031"?"WTA_OFFICIAL_COMMON_OPPONENT_NETWORK":"WTA_OFFICIAL_MATCH_HISTORY",reliability:90,unavailable_reason:av||bv?"Official WTA results reconstruct only explicitly supported match/set/ranking/workload components; unavailable game/point/news components are not inferred.":"No qualifying WTA Main match-history component was available for this metric",persistedSources:sources});});'
