  if(code==="047"){const mw=wilson(wins.length,entries.length),sw=wilson(setWins,setTotal);return `match_win_pct=${valueOrNA(pct(wins.length,entries.length))}; match_sample=${entries.length}; match_95ci=${mw?`${mw[0].toFixed(1)}-${mw[1].toFixed(1)}`:"NA"}; set_win_pct=${valueOrNA(pct(setWins,setTotal))}; set_sample=${setTotal}; set_95ci=${sw?`${sw[0].toFixed(1)}-${sw[1].toFixed(1)}`:"NA"}`;}
  if(code==="052")return `set1_leads=${won1.length}; set_lead_to_match_win_pct=${valueOrNA(pct(won1.filter(x=>x.won).length,won1.length))}; set1_deficits=${lost1.length}; set_deficit_survivability_pct=${valueOrNA(pct(lost1.filter(x=>x.won).length,lost1.length))}; game-level lead durability unavailable`;
  if(code==="055"){if(recent.prior.length<3)return null;const upsetIdx=entries.map((x,i)=>x.won&&x.own!=null&&x.opp!=null&&x.opp<x.own?i:-1).filter(i=>i>0),post=upsetIdx.map(i=>entries[i-1]).filter(Boolean);return `rolling_recent5_win_pct=${valueOrNA(winRate(recent.recent))}; rolling_prior5_win_pct=${valueOrNA(winRate(recent.prior))}; rolling_recent5_avg_opponent_rank=${valueOrNA(rankAvg(recent.recent))}; rolling_prior5_avg_opponent_rank=${valueOrNA(rankAvg(recent.prior))}; post_upset_next_match_sample=${post.length}; post_upset_next_match_win_pct=${valueOrNA(winRate(post))}`;}
  if(code==="056")return `official_match_sample=${entries.length}; score_complete_matches=${validSets.length}; set_sample=${setTotal}; ranked_opponent_sample=${entries.filter(x=>x.opp!=null).length}; sample sizes reported without inventing an adequacy threshold`;
  if(code==="057"){const ages=entries.slice(0,10).map(x=>dayDiff(String(x.r.StartDate),asOfDate));return `latest_observation_age_days=${ages[0]??"NA"}; recent10_mean_age_days=${valueOrNA(mean(ages))}; match_sample_370d=${entries.length}; score_complete_sample=${validSets.length}; independent-confirmation ratio requires other source families`;
  }
