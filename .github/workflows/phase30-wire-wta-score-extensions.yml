  if(code==="070"){const received=entries.map((x,i)=>({x,i})).filter(({x})=>x.won&&/w\/?o|walkover/i.test(String(x.r.scores??"")+' '+String(x.r.reason_code??"")));const post=received.map(({i})=>i>0?entries[i-1]:null).filter((x):x is typeof entries[number]=>!!x);if(!received.length)return null;return `walkovers_received=${received.length}; next_match_sample_after_walkover=${post.length}; next_match_win_pct_after_walkover=${valueOrNA(winRate(post))}; short-notice entry/support-team components unavailable`;}
  if(code==="077"){const year=asOfDate.slice(0,4),season=entries.filter(x=>String(x.r.StartDate).startsWith(year));const slamDeep=entries.map((x,i)=>({x,i})).filter(({x})=>norm(x.r.tournament?.tournamentGroup?.level??x.r.TournamentLevel).includes("grand slam")&&/sf|semi|f|final/i.test(String(x.r.round_name??"")));const post=slamDeep.map(({i})=>i>0?entries[i-1]:null).filter((x):x is typeof entries[number]=>!!x);return `season_matches_observed=${season.length}; season_sets_observed=${season.reduce((n,x)=>n+x.sets.length,0)}; deep_slam_runs_observed=${slamDeep.length}; post_deep_slam_next_match_sample=${post.length}; post_deep_slam_next_match_win_pct=${valueOrNA(winRate(post))}; team-event/exhibition load unavailable`;}
  if(code==="079"){const dates=entries.map(x=>String(x.r.StartDate).slice(0,10)),gaps=dates.slice(0,-1).map((d,i)=>dayDiff(dates[i+1],d)),returns=entries.slice(0,-1).filter((_,i)=>gaps[i]>=30),surfaces=entries.slice(0,10).map(x=>norm(x.r.Surface??x.r.tournament?.surface)).filter(Boolean),switches=surfaces.slice(1).filter((v,i)=>v!==surfaces[i]).length;const walk=entries.map((x,i)=>({x,i})).filter(({x})=>x.won&&/w\/?o|walkover/i.test(String(x.r.scores??"")+' '+String(x.r.reason_code??""))),post=walk.map(({i})=>i>0?entries[i-1]:null).filter((x):x is typeof entries[number]=>!!x);return `first_match_back_30d_layoff_sample=${returns.length}; first_match_back_win_pct=${valueOrNA(winRate(returns))}; recent10_surface_switches=${switches}; post_walkover_sample=${post.length}; post_walkover_win_pct=${valueOrNA(winRate(post))}; remaining coaching/medical/game-level differentiators unavailable`;}
