function wilson(wins:number,n:number){if(!n)return null;const z=1.96,p=wins/n,den=1+z*z/n,center=(p+z*z/(2*n))/den,half=z*Math.sqrt((p*(1-p)+z*z/(4*n))/n)/den;return [100*Math.max(0,center-half),100*Math.min(1,center+half)] as [number,number];}
