function valueOrNA(v:number|null|undefined,digits=1){return v==null||!Number.isFinite(v)?"NA":v.toFixed(digits);}
function extendedSideMetricValue(code:string,history:History|null,asOfDate:string){
  if(!history)return null;const rows=historyWindow(history,asOfDate);if(!rows.length)return null;
  const entries=rows.map(r=>({r,won:playerWon(r,history.playerId),sets:orientedSets(r,history.playerId),own:ownRank(r,history.playerId),opp:opponentRankFor(r,history.playerId)}));
  const validSets=entries.filter(x=>x.sets.length>=2),lost1=validSets.filter(x=>x.sets[0][0]<x.sets[0][1]),won1=validSets.filter(x=>x.sets[0][0]>x.sets[0][1]),three=validSets.filter(x=>x.sets.length>=3),tb=validSets.filter(x=>x.sets.some(isTiebreak));
  const losses=entries.filter(x=>!x.won),wins=entries.filter(x=>x.won),recent=splitTrend(entries);
