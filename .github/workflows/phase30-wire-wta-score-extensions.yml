  if(code==="043"){if(!losses.length)return null;return `losses_sample=${losses.length}; loss_after_losing_set1_pct=${valueOrNA(pct(losses.filter(x=>x.sets[0]&&x.sets[0][0]<x.sets[0][1]).length,losses.length))}; deciding_set_loss_share_pct=${valueOrNA(pct(losses.filter(x=>x.sets.length>=3).length,losses.length))}; tiebreak_loss_context_pct=${valueOrNA(pct(losses.filter(x=>x.sets.some(isTiebreak)).length,losses.length))}; historical failure-mode components only`;
  }
  if(code==="044"){const upsets=wins.filter(x=>x.own!=null&&x.opp!=null&&x.opp<x.own);if(!upsets.length)return null;const gaps=upsets.map(x=>x.own!-x.opp!);return `higher_ranked_opponents_beaten=${upsets.length}; largest_ranking_gap_overcome=${Math.max(...gaps).toFixed(0)}; avg_upset_opponent_rank=${valueOrNA(rankAvg(upsets))}; multi-dimensional style/Elo/price similarity unavailable`;
