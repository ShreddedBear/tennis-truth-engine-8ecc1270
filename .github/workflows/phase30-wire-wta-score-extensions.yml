name: Phase 30 wire WTA score extensions

on:
  push:
    branches:
      - repair/evidence-coverage-phase30-wta-score-extensions
    paths:
      - '.github/workflows/phase30-wire-wta-score-extensions.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/evidence-coverage-phase30-wta-score-extensions
      - name: Add objective score/ranking-derived WTA partial metrics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/wta-official-match-evidence.server.ts')
          s=p.read_text()
          old='const SUPPORTED = new Set(["005", "006", "007", "008", "009", "010", "011", "012", "013", "020", "028", "030", "068", "080"]);'
          new='const SUPPORTED = new Set(["005", "006", "007", "008", "009", "010", "011", "012", "013", "020", "026", "027", "028", "029", "030", "031", "036", "037", "040", "041", "043", "044", "045", "047", "052", "055", "056", "057", "064", "068", "070", "077", "079", "080", "081"]);'
          if old not in s: raise SystemExit('SUPPORTED anchor missing')
          s=s.replace(old,new,1)

          helper=r'''
function historyWindow(history:History,asOfDate:string){const cutoff=new Date(`${asOfDate}T00:00:00Z`);cutoff.setUTCDate(cutoff.getUTCDate()-370);const min=cutoff.toISOString().slice(0,10);return history.matches.filter(r=>String(r.StartDate).slice(0,10)>=min);}
function ownRank(row:MatchRow,playerId:string){const side=String(row.player_1??"").trim()===playerId?1:String(row.player_2??"").trim()===playerId?2:null;const n=Number(side===1?row.rank_1:side===2?row.rank_2:null);return Number.isFinite(n)&&n>0?n:null;}
function opponentRankFor(row:MatchRow,playerId:string){const side=String(row.player_1??"").trim()===playerId?1:String(row.player_2??"").trim()===playerId?2:null;const n=Number(side===1?row.rank_2:side===2?row.rank_1:null);return Number.isFinite(n)&&n>0?n:null;}
