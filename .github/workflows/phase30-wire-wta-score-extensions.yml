}
function extendedCommonOpponentValue(a:History|null,b:History|null,asOfDate:string){
  if(!a||!b)return null;const aw=historyWindow(a,asOfDate),bw=historyWindow(b,asOfDate);const group=(h:History,rows:MatchRow[])=>{const m=new Map<string,{name:string;entries:Array<{r:MatchRow;won:boolean;sets:Array<[number,number]>}>}>();for(const r of rows){const k=norm(r.opponent?.fullName);if(!k)continue;const x=m.get(k)??{name:String(r.opponent?.fullName),entries:[]};x.entries.push({r,won:playerWon(r,h.playerId),sets:orientedSets(r,h.playerId)});m.set(k,x);}return m};const am=group(a,aw),bm=group(b,bw),keys=[...am.keys()].filter(k=>bm.has(k));if(!keys.length)return null;
  const summarizeCommon=(h:History,m:ReturnType<typeof group>)=>{const es=keys.flatMap(k=>m.get(k)!.entries),sets=es.flatMap(x=>x.sets),set1=es.filter(x=>x.sets[0]),straight=es.filter(x=>x.won&&x.sets.length===2&&x.sets.every(([x,y])=>x>y)),d30=es.filter(x=>dayDiff(String(x.r.StartDate),asOfDate)<=30),d60=es.filter(x=>dayDiff(String(x.r.StartDate),asOfDate)<=60),d90=es.filter(x=>dayDiff(String(x.r.StartDate),asOfDate)<=90);return `direct_common_opponents=${keys.length}; common_matches=${es.length}; common_win_pct=${valueOrNA(pct(es.filter(x=>x.won).length,es.length))}; common_set_win_pct=${valueOrNA(pct(sets.filter(([x,y])=>x>y).length,sets.length))}; common_set1_win_pct=${valueOrNA(pct(set1.filter(x=>x.sets[0][0]>x.sets[0][1]).length,set1.length))}; common_straight_set_win_share_pct=${valueOrNA(pct(straight.length,es.length))}; common_matches_30d=${d30.length}; common_matches_60d=${d60.length}; common_matches_90d=${d90.length}; score/rank network components only`;};return {p1:summarizeCommon(a,am),p2:summarizeCommon(b,bm),sample:keys.length};
