  const setWins=validSets.reduce((n,x)=>n+x.sets.filter(([a,b])=>a>b).length,0),setTotal=validSets.reduce((n,x)=>n+x.sets.length,0);
  if(code==="026")return `set1_win_pct=${valueOrNA(pct(validSets.filter(x=>x.sets[0][0]>x.sets[0][1]).length,validSets.length))}; set2_win_pct=${valueOrNA(pct(validSets.filter(x=>x.sets[1][0]>x.sets[1][1]).length,validSets.length))}; second_set_win_after_set1_loss_pct=${valueOrNA(pct(lost1.filter(x=>x.sets[1][0]>x.sets[1][1]).length,lost1.length))}; score-level warm-up proxy only; early-game/PBP components unavailable`;
  if(code==="027")return `set1_leads=${won1.length}; set1_to_match_conversion_pct=${valueOrNA(pct(won1.filter(x=>x.won).length,won1.length))}; one_set_up_collapse_pct=${valueOrNA(pct(won1.filter(x=>!x.won).length,won1.length))}; deciding_matches=${three.length}; deciding_match_close_pct=${valueOrNA(pct(three.filter(x=>x.won).length,three.length))}`;
  if(code==="029"){const lostTb=validSets.filter(x=>x.sets[0]&&isTiebreak(x.sets[0])&&x.sets[0][0]<x.sets[0][1]);return `front_runner_win_pct=${valueOrNA(pct(won1.filter(x=>x.won).length,won1.length))}; comeback_win_pct=${valueOrNA(pct(lost1.filter(x=>x.won).length,lost1.length))}; second_set_win_after_losing_set1_pct=${valueOrNA(pct(lost1.filter(x=>x.sets[1][0]>x.sets[1][1]).length,lost1.length))}; matches_after_losing_set1_tiebreak=${lostTb.length}; match_win_after_losing_set1_tiebreak_pct=${valueOrNA(pct(lostTb.filter(x=>x.won).length,lostTb.length))}`;
  if(code==="036"){if(!losses.length)return null;const lostSet1=losses.filter(x=>x.sets[0]&&x.sets[0][0]<x.sets[0][1]).length,dec=losses.filter(x=>x.sets.length>=3).length,tbl=losses.filter(x=>x.sets.some(isTiebreak)).length,bad=losses.filter(x=>x.own!=null&&x.opp!=null&&x.opp>x.own+20).length;const reasons=[...new Set(losses.map(x=>String(x.r.reason_code??"").trim()).filter(Boolean))].slice(0,6);return `recent_losses=${losses.length}; avg_loss_opponent_rank=${valueOrNA(rankAvg(losses))}; lost_set1_in_loss_pct=${valueOrNA(pct(lostSet1,losses.length))}; deciding_set_loss_pct=${valueOrNA(pct(dec,losses.length))}; tiebreak_in_loss_pct=${valueOrNA(pct(tbl,losses.length))}; losses_to_20plus_lower_ranked=${bad}; observed_reason_codes=${reasons.join(",")||"none"}`;}
