name: Phase 27 validate WTA evidence

on:
  push:
    branches:
      - repair/evidence-coverage-phase27-wta-match-probe
    paths:
      - 'src/lib/wta-official-match-evidence.server.ts'
      - 'src/lib/hybrid-audit-research.server.ts'
      - '.github/workflows/phase27-validate-wta-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Live WTA evidence proof and tour firewall
        shell: bash
        run: |
          cat > src/lib/phase27-wta-live.test.ts <<'TS'
          import { describe,it,expect } from "vitest";
          import { officialWtaMetricRows } from "./wta-official-match-evidence.server";
          const metrics=Array.from({length:81},(_,i)=>({code:String(i+1).padStart(3,"0"),name:`Metric ${String(i+1).padStart(3,"0")}`,body:null}));
          const usable=(r:any)=>["DIRECT","RECONSTRUCTED","PARTIAL"].includes(String(r?.p1_treatment))&&["DIRECT","RECONSTRUCTED","PARTIAL"].includes(String(r?.p2_treatment))&&r?.p1_value!=null&&r?.p2_value!=null;
          describe("official WTA evidence lane",()=>{
            it("recovers real paired WTA Main evidence",async()=>{
              const rows=await officialWtaMetricRows({p1:"Jessica Pegula",p2:"Iga Swiatek",context:"Tournament: US Open | Level: WTA MAIN | Tour: WTA MAIN | Surface: hard | Date: 2026-08-25",metrics});
              expect(rows).not.toBeNull();
              const good=(rows??[]).filter(usable);
              console.log(`PHASE27|WTA_MAIN|PAIRED=${good.length}|CODES=${good.map(r=>String(r.metric_code).padStart(3,"0")).join(',')}`);
              expect(good.length).toBeGreaterThanOrEqual(8);
              expect(good.some(r=>String(r.metric_code).padStart(3,"0")==="005")).toBe(true);
              expect(good.some(r=>String(r.metric_code).padStart(3,"0")==="012")).toBe(true);
            },30000);
            it("fails closed for ATP Main",async()=>{
              expect(await officialWtaMetricRows({p1:"Flavio Cobolli",p2:"Arthur Fils",context:"Tournament: ATP MAIN | Level: ATP MAIN | Tour: ATP MAIN | Surface: hard | Date: 2026-08-25",metrics})).toBeNull();
            });
            it("fails closed for WTA 125",async()=>{
              expect(await officialWtaMetricRows({p1:"Jessica Pegula",p2:"Iga Swiatek",context:"Tournament: WTA 125 | Level: WTA 125 | Tour: WTA 125 | Surface: hard | Date: 2026-08-25",metrics})).toBeNull();
            });
          });
          TS
          bunx vitest run src/lib/phase27-wta-live.test.ts --reporter=verbose
          rm src/lib/phase27-wta-live.test.ts
      - name: Regression tests
        run: bunx vitest run
      - name: Build app
        run: bun run build
