name: Phase 22 fallback precedence validation
on:
  push:
    branches: [repair/evidence-coverage-phase22-local-certified-bridge]
    paths: ['.github/workflows/phase22-fallback-precedence.yml']
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/evidence-coverage-phase22-local-certified-bridge
      - name: Require actual side values and usable fallback precedence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/lib/evidence-coverage-runtime-diagnostic.server.ts')
          s=p.read_text()
          marker='function codeOf(value:unknown){'
          helper='''function usableEvidenceSide(treatment:unknown,value:unknown){return USABLE.has(String(treatment??""))&&value!==null&&value!==undefined&&String(value).trim()!=="";}\nfunction chooseEvidenceSide(stored:any,deterministic:any,internal:any,side:"p1"|"p2"){\n  const candidates=[\n    {treatment:stored?.treatment,value:stored?.value_text,source:"stored"},\n    {treatment:deterministic?.[`${side}_treatment`],value:deterministic?.[`${side}_value`],source:"deterministic"},\n    {treatment:internal?.[`${side}_treatment`],value:internal?.[`${side}_value`],source:"certified_local"},\n  ];\n  return candidates.find(candidate=>usableEvidenceSide(candidate.treatment,candidate.value))??candidates.find(candidate=>candidate.treatment!==null&&candidate.treatment!==undefined)??{treatment:"UNAVAILABLE",value:null,source:"none"};\n}\n'''
          if 'function chooseEvidenceSide(' not in s:
            assert marker in s
            s=s.replace(marker,helper+marker,1)
          s=s.replace('select("metric_code,player_name,opponent_name,treatment,evidence_family")','select("metric_code,player_name,opponent_name,treatment,value_text,evidence_family")',1)
          old='local=localByCode.get(code)??{row:null,errors:[]},internal=certifiedLocalByCode.get(code)??null;const p1Treatment=String(p1Stored?.treatment??local.row?.p1_treatment??internal?.p1_treatment??"UNAVAILABLE"),p2Treatment=String(p2Stored?.treatment??local.row?.p2_treatment??internal?.p2_treatment??"UNAVAILABLE"),p1Usable=USABLE.has(p1Treatment),p2Usable=USABLE.has(p2Treatment)'
          new='local=localByCode.get(code)??{row:null,errors:[]},internal=certifiedLocalByCode.get(code)??null,p1Chosen=chooseEvidenceSide(p1Stored,local.row,internal,"p1"),p2Chosen=chooseEvidenceSide(p2Stored,local.row,internal,"p2");const p1Treatment=String(p1Chosen.treatment??"UNAVAILABLE"),p2Treatment=String(p2Chosen.treatment??"UNAVAILABLE"),p1Usable=usableEvidenceSide(p1Treatment,p1Chosen.value),p2Usable=usableEvidenceSide(p2Treatment,p2Chosen.value)'
          assert old in s or 'p1Chosen=chooseEvidenceSide' in s
          if old in s:s=s.replace(old,new,1)
          old='local_internal_p1:Boolean(internal?.p1_value),local_internal_p2:Boolean(internal?.p2_value),failure_bucket:bucket,reason'
          new='local_internal_p1:Boolean(internal?.p1_value),local_internal_p2:Boolean(internal?.p2_value),credited_source_p1:p1Usable?p1Chosen.source:null,credited_source_p2:p2Usable?p2Chosen.source:null,failure_bucket:bucket,reason'
          if old in s:s=s.replace(old,new,1)
          p.write_text(s)

          t=Path('src/lib/evidence-coverage-runtime-diagnostic.test.ts')
          ts=t.read_text()
          block='''\n\ndescribe("coverage fallback precedence requires real side values", () => {\n  it("does not let an unavailable deterministic row block certified local evidence", () => {\n    expect(diagnostic).toContain('function chooseEvidenceSide(');\n    expect(diagnostic).toContain('candidates.find(candidate=>usableEvidenceSide(candidate.treatment,candidate.value))');\n    expect(diagnostic).toContain('select("metric_code,player_name,opponent_name,treatment,value_text,evidence_family")');\n    expect(diagnostic).toContain('p1Usable=usableEvidenceSide(p1Treatment,p1Chosen.value)');\n    expect(diagnostic).toContain('credited_source_p1:p1Usable?p1Chosen.source:null');\n  });\n});\n'''
          if 'coverage fallback precedence requires real side values' not in ts:t.write_text(ts+block)
          PY
      - name: Run focused tests and build
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://bun.sh/install | bash
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
          bunx vitest run src/lib/evidence-coverage-runtime-diagnostic.test.ts src/lib/postfix-wiring-007-011.test.ts src/lib/trusted-internal-evidence.test.ts
          bun run build
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/evidence-coverage-runtime-diagnostic.server.ts src/lib/evidence-coverage-runtime-diagnostic.test.ts
          git commit -m 'Require real side values before evidence coverage credit'
          git push origin HEAD:repair/evidence-coverage-phase22-local-certified-bridge
