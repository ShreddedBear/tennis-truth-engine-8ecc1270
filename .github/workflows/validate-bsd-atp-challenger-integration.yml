name: Validate BSD ATP Challenger Integration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-bsd-atp-challenger-integration.yml'
      - 'src/lib/bsd-atp-challenger-pbp.server.ts'
      - 'src/lib/warehouse-first-researcher.server.ts'
      - 'src/lib/source-observation-metric-bridge.server.ts'
      - 'src/lib/metric-source-family-policy.ts'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate ATP Challenger PBP integration and contamination firewall
        shell: bash
        run: |
          set -euo pipefail
          test -f src/lib/bsd-atp-challenger-pbp.server.ts
          test -f src/lib/warehouse-first-researcher.server.ts
          test -f src/lib/metric-source-family-policy.ts

          grep -q 'const COVERAGE_START = "2025-01-01"' src/lib/bsd-atp-challenger-pbp.server.ts
          grep -q 'Array.from({ length: endYear - 2025 + 1 }' src/lib/bsd-atp-challenger-pbp.server.ts
          grep -q 'circuit !== "ATP"' src/lib/bsd-atp-challenger-pbp.server.ts
          grep -q 'wta 125' src/lib/bsd-atp-challenger-pbp.server.ts
          grep -q 'wta125' src/lib/bsd-atp-challenger-pbp.server.ts
          grep -q 'atp main' src/lib/bsd-atp-challenger-pbp.server.ts
          grep -q 'masters 1000' src/lib/bsd-atp-challenger-pbp.server.ts
          grep -q 'atp 250' src/lib/bsd-atp-challenger-pbp.server.ts
          grep -q 'atp 500' src/lib/bsd-atp-challenger-pbp.server.ts
          grep -q 'STRICT_ATP_CHALLENGER_ONLY' src/lib/bsd-atp-challenger-pbp.server.ts
          grep -q 'POINT_BY_POINT' src/lib/bsd-atp-challenger-pbp.server.ts

          grep -q 'buildBsdAtpChallengerPbpContext' src/lib/warehouse-first-researcher.server.ts
          grep -q 'bsdAtpChallengerPbp.packet' src/lib/warehouse-first-researcher.server.ts
          grep -q '_bsd_atp_challenger_pbp_status' src/lib/warehouse-first-researcher.server.ts

          grep -q 'PBP_METRICS' src/lib/metric-source-family-policy.ts
          grep -q 'allowed.add("POINT_BY_POINT")' src/lib/metric-source-family-policy.ts
          grep -q 'allowed_families.includes(family)' src/lib/metric-source-family-policy.ts

          echo 'PASS: BSD ATP Challenger PBP is limited to 2025-current, wired into the metrics pipeline, and blocked from ATP Main/WTA/WTA125 contamination.'
