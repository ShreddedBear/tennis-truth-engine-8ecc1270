name: Sync TennisData.app WTA Challenger 2021-2026

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-tennisdata-wta-challenger.py'
      - '.github/workflows/sync-tennisdata-wta-challenger.yml'

permissions:
  contents: write

concurrency:
  group: tennisdata-wta-challenger-history
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pandas requests

      - name: Sync WTA Challenger / WTA 125 history
        env:
          TENNISDATA_WTA_URL_TEMPLATE: ${{ secrets.TENNISDATA_WTA_URL_TEMPLATE }}
        run: python scripts/sync-tennisdata-wta-challenger.py

      - name: Commit integrated match history
        run: |
          if git diff --quiet -- data/public/tennisdata-wta-challenger; then
            echo 'No data changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/public/tennisdata-wta-challenger
          git commit -m 'Sync TennisData.app WTA Challenger 2021-2026 matches'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tennisdata-wta-challenger-sync
          path: data/public/tennisdata-wta-challenger/
          if-no-files-found: warn
