name: Sync TennisData.app WTA Challenger 2021-2026

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-tennisdata-wta-challenger.py'
      - '.github/workflows/sync-tennisdata-wta-challenger.yml'

permissions:
  contents: write

concurrency:
  group: tennisdata-wta-challenger-history
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark sync running
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p data/public/tennisdata-wta-challenger
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          p='data/public/tennisdata-wta-challenger/STATUS.json'
          json.dump({
            'state':'RUNNING',
            'message':'GitHub Actions sync is currently running',
            'updated_at_utc':datetime.now(timezone.utc).isoformat(),
            'run_id':os.environ['RUN_ID'],
            'run_url':os.environ['RUN_URL']
          }, open(p,'w'), indent=2)
          open(p,'a').write('\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/public/tennisdata-wta-challenger/STATUS.json
          git commit -m 'Mark WTA Challenger sync running' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pandas requests

      - name: Sync WTA Challenger / WTA 125 history
        env:
          TENNISDATA_WTA_URL_TEMPLATE: ${{ secrets.TENNISDATA_WTA_URL_TEMPLATE }}
        run: python scripts/sync-tennisdata-wta-challenger.py

      - name: Mark sync final status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          state = 'SUCCESS' if os.environ['JOB_STATUS'] == 'success' else 'FAILED'
          p='data/public/tennisdata-wta-challenger/STATUS.json'
          json.dump({
            'state':state,
            'message':'GitHub Actions sync completed successfully' if state == 'SUCCESS' else 'GitHub Actions sync failed; inspect the run URL',
            'updated_at_utc':datetime.now(timezone.utc).isoformat(),
            'run_id':os.environ['RUN_ID'],
            'run_url':os.environ['RUN_URL']
          }, open(p,'w'), indent=2)
          open(p,'a').write('\n')
          PY

      - name: Commit integrated match history and status
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/public/tennisdata-wta-challenger
          git commit -m 'Sync TennisData.app WTA Challenger 2021-2026 matches and status' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tennisdata-wta-challenger-sync
          path: data/public/tennisdata-wta-challenger/
          if-no-files-found: warn
