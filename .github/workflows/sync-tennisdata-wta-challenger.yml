name: Sync TennisData.app WTA Challenger 2021-2026

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tennisdata-wta-challenger-history
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Staging guard
        run: |
          echo 'Direct plain-CSV migration is being staged. Re-enable this workflow only after all normalized source files are committed.'
          exit 1
