name: Sync TennisData.app WTA Challenger 2021-2026

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/raw/tennisdata-wta-challenger/**'
      - 'scripts/sync-tennisdata-wta-challenger.py'
      - '.github/workflows/sync-tennisdata-wta-challenger.yml'

permissions:
  contents: write

concurrency:
  group: tennisdata-wta-challenger-history
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify complete compact WTA-Challenger-only inputs exist
        run: |
          set -euo pipefail
          test -s data/raw/tennisdata-wta-challenger/2021-compact.csv.gz.b64
          test -s data/raw/tennisdata-wta-challenger/2022-compact.csv.gz.b64
          test -s data/raw/tennisdata-wta-challenger/2023-compact.csv.gz.b64
          test -s data/raw/tennisdata-wta-challenger/2024-v2.csv.xz.b64.part01
          test -s data/raw/tennisdata-wta-challenger/2024-v2.csv.xz.b64.part02
          test -s data/raw/tennisdata-wta-challenger/2025-v2.csv.xz.b64.part01
          test -s data/raw/tennisdata-wta-challenger/2025-v2.csv.xz.b64.part02
          test -s data/raw/tennisdata-wta-challenger/2025-v2.csv.xz.b64.part03
          test -s data/raw/tennisdata-wta-challenger/2026-v2.csv.xz.b64.part01
          test -s data/raw/tennisdata-wta-challenger/2026-v2.csv.xz.b64.part02
          test -s data/raw/tennisdata-wta-challenger/2026-v2.csv.xz.b64.part03

      - name: Mark sync running
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p data/public/tennisdata-wta-challenger
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          p='data/public/tennisdata-wta-challenger/STATUS.json'
          json.dump({'state':'RUNNING','message':'WTA Challenger-only TennisData sync is running','updated_at_utc':datetime.now(timezone.utc).isoformat(),'run_id':os.environ['RUN_ID'],'run_url':os.environ['RUN_URL']},open(p,'w'),indent=2)
          open(p,'a').write('\n')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pandas

      - name: Sync ONLY WTA Challenger / WTA 125 history
        run: python scripts/sync-tennisdata-wta-challenger.py

      - name: Verify zero main-tour contamination
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/public/tennisdata-wta-challenger/IMPORT_MANIFEST.json')
          if not p.exists(): raise SystemExit('IMPORT_MANIFEST.json missing')
          m=json.loads(p.read_text())
          if m.get('contamination_firewall')!='PASS': raise SystemExit('Contamination firewall did not PASS')
          if m.get('main_tour_rows_integrated')!=0: raise SystemExit(f"MAIN TOUR CONTAMINATION DETECTED: {m.get('main_tour_rows_integrated')}")
          if set(m.get('years',{})) != {'2021','2022','2023','2024','2025','2026'}: raise SystemExit('Not all six years were integrated')
          print('PASS: all six years loaded; zero regular WTA main-tour rows integrated')
          PY

      - name: Mark sync final status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p data/public/tennisdata-wta-challenger
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          state='SUCCESS' if os.environ['JOB_STATUS']=='success' else 'FAILED'
          p='data/public/tennisdata-wta-challenger/STATUS.json'
          json.dump({'state':state,'message':'WTA 125 sync completed with contamination firewall PASS' if state=='SUCCESS' else 'WTA 125 sync failed; no unverified data integrated','updated_at_utc':datetime.now(timezone.utc).isoformat(),'run_id':os.environ['RUN_ID'],'run_url':os.environ['RUN_URL']},open(p,'w'),indent=2)
          open(p,'a').write('\n')
          PY

      - name: Commit integrated WTA 125 history and status
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/public/tennisdata-wta-challenger
          git commit -m 'Sync contamination-safe TennisData.app WTA 125 history' || true
          git push origin HEAD:main

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tennisdata-wta-challenger-sync
          path: data/public/tennisdata-wta-challenger/
          if-no-files-found: warn
