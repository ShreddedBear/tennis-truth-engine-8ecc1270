name: Phase 28 Four-Tour Evidence Diagnostic CI

on:
  push:
    branches:
      - repair/evidence-coverage-phase28-four-tour-diagnostic
    paths:
      - 'scripts/apply-phase28-four-tour-diagnostic.py'
      - 'scripts/apply-phase28-contract-updates.py'
      - 'src/lib/evidence-index-match-sampler.server.ts'
      - 'src/lib/evidence-coverage-runtime-diagnostic.server.ts'
      - 'src/lib/evidence-coverage-runtime-diagnostic.test.ts'
      - 'src/lib/evidence-coverage-four-tour-diagnostic.test.ts'
      - '.github/workflows/evidence-coverage-production-proof.yml'
      - '.github/workflows/phase28-four-tour-diagnostic-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply four-tour diagnostic repair from validated WTA 125 production history
        run: |
          python scripts/apply-phase28-four-tour-diagnostic.py
          python scripts/apply-phase28-contract-updates.py
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Four-tour diagnostic regression
        run: bunx vitest run src/lib/evidence-coverage-four-tour-diagnostic.test.ts src/lib/evidence-coverage-runtime-diagnostic.test.ts
      - name: Full regression suite
        run: bunx vitest run
      - name: Production build
        run: bun run build
      - name: Persist generated four-tour repair on branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Phase 28 generated files already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/evidence-index-match-sampler.server.ts src/lib/evidence-coverage-runtime-diagnostic.server.ts src/lib/evidence-coverage-runtime-diagnostic.test.ts .github/workflows/evidence-coverage-production-proof.yml
          git commit -m 'Evidence Coverage: validate all four tour representatives'
          git pull --rebase origin repair/evidence-coverage-phase28-four-tour-diagnostic
          git push origin HEAD:repair/evidence-coverage-phase28-four-tour-diagnostic
