name: Drive Audit Batch

# MANUAL BACKSTOP ONLY. This is no longer the production scheduler.
#
# Production scheduling is Replit-owned: scripts/drive-audit-worker.ts, run either as a
# Replit Scheduled Deployment (RUN_ONCE=true) or as a Reserved VM. Normal operation does
# not depend on GitHub Actions, which is the point -- see docs/replit-runtime.md.
#
# The cron is removed rather than the workflow, so this stays available to drive audits by
# hand from the Actions tab when that is useful, without silently competing with the
# Replit worker on a schedule. Both paths claim work through the same database leases, so
# running them together is safe; running them together CONSTANTLY is just noise.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drive-audit-batch
  cancel-in-progress: false

jobs:
  drive:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build runtime tennis index from committed CSV sources
        run: node scripts/build-runtime-tennis-index.mjs

      - name: Drive every RUNNING audit one wave forward
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEARCH_FALLBACK_API_KEY: ${{ secrets.RESEARCH_FALLBACK_API_KEY }}
          RESEARCH_FALLBACK_URL: ${{ secrets.RESEARCH_FALLBACK_URL }}
          # The repo secret is actually named OPEN_API, not OPENAI_API_KEY --
          # this maps it to the env var name the code (audit-research.server.ts)
          # actually reads, without renaming the secret itself.
          OPENAI_API_KEY: ${{ secrets.OPEN_API || secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: bun run scripts/drive-audit-batch.ts
