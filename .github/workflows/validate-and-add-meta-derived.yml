name: Validate Wiring And Add Meta Derived
on:
  push:
    paths:
      - '.github/workflows/validate-and-add-meta-derived.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct prior sweep wiring and add safe meta-derived metrics
        shell: python
        run: |
          from pathlib import Path

          # 1) Correct evidence-gap master-list labels 004-006.
          p=Path('src/lib/evidence-gap.ts')
          s=p.read_text()
          s=s.replace('["004","Required derived metrics added to the metrics workflow","Elo/form/serve/return/MC inputs needed by each defined derived comparison","META_DERIVED"],', '["004","Combined Efficiency","serve/return point rates, hold/break rates, dominance and matchup-specific expected hold/break inputs","RECONSTRUCTABLE"],')
          s=s.replace('["005","Interpretation rules","reliability, sample, independence, surface relevance and metric magnitudes","META_DERIVED"],', '["005","Recent Form","last-5/last-10 results, set results, surface swing, opponent quality and chronological trend","RECONSTRUCTABLE"],')
          s=s.replace('["006","Recalibration rule","recent results, opponent quality, surface/form history and current calibration sample","RECONSTRUCTABLE"],', '["006","Opponent-Adjusted Strength of Schedule","recent opponent strength, comparable-strength results, bad-loss rate and common-opponent quality","RECONSTRUCTABLE"],')
          p.write_text(s)

          # 2) Hybrid historical expansions 035/055/068/080 are valid but partial-family coverage.
          p=Path('src/lib/hybrid-audit-research.server.ts')
          s=p.read_text()
          anchor='function localMetricRows(p1:string,p2:string,context:string,requested:Array<{code:string;name:string;body:string|null}>):MetricFinding[]{'
          if 'const LOCAL_PARTIAL_FAMILIES=' not in s:
              s=s.replace(anchor, 'const LOCAL_PARTIAL_FAMILIES=new Set(["035","055","068","080"]);\n'+anchor)
          old='p1_treatment:xs?"RECONSTRUCTED":"UNAVAILABLE",p2_treatment:ys?"RECONSTRUCTED":"UNAVAILABLE"'
          new='p1_treatment:xs?(LOCAL_PARTIAL_FAMILIES.has(familyCode(m.code))?"PARTIAL":"RECONSTRUCTED"):"UNAVAILABLE",p2_treatment:ys?(LOCAL_PARTIAL_FAMILIES.has(familyCode(m.code))?"PARTIAL":"RECONSTRUCTED"):"UNAVAILABLE"'
          if old not in s: raise SystemExit('hybrid treatment anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          # 3) Completion sweep: 068 is broad/partial, and 027 is opponent-side evidence.
          p=Path('src/lib/completion-sweep-research.server.ts')
          s=p.read_text()
          s=s.replace('const PARTIAL_FAMILIES=new Set(["027","037","077"]);','const PARTIAL_FAMILIES=new Set(["027","037","068","077"]);')
          old='''  const p1=selected(p1all,keys),p2=selected(p2all,keys),p1Value=summarize(p1),p2Value=summarize(p2);'''
          new='''  let p1=selected(p1all,keys),p2=selected(p2all,keys);\n  // 027 is Opponent Finishing Ability: each displayed side must describe that side's opponent.\n  if(family==="027"){const own=p1;p1=p2;p2=own;}\n  const p1Value=summarize(p1),p2Value=summarize(p2);'''
          if old not in s: raise SystemExit('completion historical selection anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          # 4) Add safe post-metric META_DERIVED calculations to pipeline.
          p=Path('src/lib/audit-pipeline.ts')
          s=p.read_text()
          anchor='const treatmentToStatus=(t:Treatment)=>t==="UNAVAILABLE"?"UNAVAILABLE":t==="EXCLUDED"?"EXCLUDED":"COMPLETE";\n'
          helper=r'''
const META_DERIVED_CODES=new Set(["048","049","056","057"]);
const USABLE_TREATMENTS=new Set<Treatment>(["DIRECT","RECONSTRUCTED","PARTIAL"]);
function metricCodeOf(row:Record<string,unknown>){const m=String(row["metric_code"]??"").match(/(\d{1,3})$/);return m?m[1].padStart(3,"0"):String(row["metric_code"]??"").padStart(3,"0");}
function sourceRefsOf(row:Record<string,unknown>):SourceRef[]{return Array.isArray(row["sources"])?(row["sources"] as SourceRef[]):[];}
function uniqueSources(rows:Array<Record<string,unknown>>){const out:SourceRef[]=[];for(const row of rows)for(const src of sourceRefsOf(row)){if(!out.some(x=>x.source_name===src.source_name&&x.url===src.url))out.push(src);}return out;}
async function applyMetaDerivedMetrics(deps:PipelineDeps,runId:string){
  const rows=await deps.list("metric_results",runId),base=rows.filter(r=>!META_DERIVED_CODES.has(metricCodeOf(r))&&r["matrix_derived"]!==true);
  const targets=new Map(rows.map(r=>[metricCodeOf(r),r]));
  for(const side of ["p1","p2"] as const){
    const treatmentKey=side==="p1"?"p1_treatment":"p2_treatment",valueKey=side==="p1"?"p1_value":"p2_value",statusKey=side==="p1"?"p1_status":"p2_status";
    const usable=base.filter(r=>USABLE_TREATMENTS.has(String(r[treatmentKey]) as Treatment)&&r[valueKey]!==null&&r[valueKey]!==undefined&&r[valueKey]!=="");
    const unavailable=base.filter(r=>String(r[treatmentKey])==="UNAVAILABLE").length;
    const families=usable.map(r=>String(r["evidence_family"]??"")).filter(Boolean),familyCounts=new Map<string,number>();for(const f of families)familyCounts.set(f,(familyCounts.get(f)??0)+1);
    const distinctFamilies=familyCounts.size,maxFamily=Math.max(0,...familyCounts.values()),maxFamilyShare=usable.length?100*maxFamily/usable.length:0;
    const sourced=usable.filter(r=>sourceRefsOf(r).length>0),sources=uniqueSources(usable),reliabilities=usable.map(r=>Number(r["reliability"])).filter(Number.isFinite),samples=usable.filter(r=>r["sample"]!==null&&r["sample"]!==undefined&&String(r["sample"]).trim()!=="");
    const retrieved=usable.filter(r=>r[side==="p1"?"p1_retrieved_at":"p2_retrieved_at"]||r["retrieved_at"]).length,avgReliability=reliabilities.length?reliabilities.reduce((a,b)=>a+b,0)/reliabilities.length:null;
    const values:Record<string,{value:string;treatment:Treatment;family:string;missing:string[]}>={
      "048":{value:`independent_evidence_families=${distinctFamilies}; usable_metric_sides=${usable.length}/${base.length}`,treatment:"RECONSTRUCTED",family:"META_INDEPENDENT_EVIDENCE_COUNT",missing:[]},
      "049":{value:`distinct_families=${distinctFamilies}; max_family_share_pct=${maxFamilyShare.toFixed(1)}; unique_source_refs=${sources.length}; repeated_family_rows=${Math.max(0,usable.length-distinctFamilies)}`,treatment:"PARTIAL",family:"META_SOURCE_LINEAGE_OVERLAP",missing:["formal correlation/covariance map between evidence families"]},
      "056":{value:`usable=${usable.length}/${base.length}; unavailable=${unavailable}; source_confirmed=${sourced.length}; sample_reported=${samples.length}; avg_reliability=${avgReliability===null?"NA":avgReliability.toFixed(1)}`,treatment:"PARTIAL",family:"META_DATA_INTEGRITY",missing:["full source-specific quality audit for every submetric"]},
      "057":{value:`source_confirmed=${sourced.length}/${usable.length}; retrieved_timestamp_present=${retrieved}/${usable.length}; evidence_families=${distinctFamilies}; avg_reliability=${avgReliability===null?"NA":avgReliability.toFixed(1)}`,treatment:"PARTIAL",family:"META_EVIDENCE_FRESHNESS_CONFIRMATION",missing:["underlying source-event freshness for sources that expose only retrieval time","complete surface-relevance score for every evidence family"]},
    };
    for(const [code,v] of Object.entries(values)){const row=targets.get(code);if(!row)continue;const partial=v.treatment==="PARTIAL";await deps.update("metric_results",String(row["id"]),{[valueKey]:v.value,[treatmentKey]:v.treatment,[statusKey]:"COMPLETE",status:"COMPLETE",evidence_family:v.family,reliability:v.treatment==="RECONSTRUCTED"?90:75,sample:String(usable.length),sources,source_attempts:sources,reconstruction_attempted:true,reconstruction_reason:"Deterministically derived from persisted pre-Matrix independent metric treatments and provenance.",reconstruction_result:v.value,retrieved_at:deps.now().toISOString(),[side==="p1"?"p1_retrieved_at":"p2_retrieved_at"]:deps.now().toISOString(),[side==="p1"?"p1_unavailable_reason":"p2_unavailable_reason"]:partial?"MISSING_REQUIRED_INPUT":null,unavailable_reason:partial?"MISSING_REQUIRED_INPUT":null,unavailable_detail:partial?`Partial meta-derived coverage; missing ${v.missing.join("; ")}.`:null,missing_inputs:v.missing});}
  }
}
'''
          if 'async function applyMetaDerivedMetrics' not in s:
              if anchor not in s: raise SystemExit('pipeline helper anchor not found')
              s=s.replace(anchor,anchor+helper)
          call='if(side==="p2"&&!timedOut)await applyMetaDerivedMetrics(deps,runId);'
          target='const after=await deps.list("metric_results",runId),done=after.filter'
          if call not in s:
              if target not in s: raise SystemExit('pipeline meta call anchor not found')
              s=s.replace(target,call+'\n'+target,1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/evidence-gap.ts src/lib/hybrid-audit-research.server.ts src/lib/completion-sweep-research.server.ts src/lib/audit-pipeline.ts
          git diff --cached --quiet && exit 0
          git commit -m "Validate evidence wiring and derive safe meta metrics"
          git push
