name: Sync DataHub ATP Serve Return Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download CC BY 4.0 ATP match stats and scores
        run: |
          set -euo pipefail
          rm -rf data/public/datahub-atp
          mkdir -p data/public/datahub-atp

          curl -L --fail --retry 3 \
            "https://datahub.io/core/atp-world-tour-tennis-data/_r/-/csv/2_match_scores/match_scores_1991-2016_UNINDEXED.csv" \
            -o data/public/datahub-atp/match_scores_1991-2016.csv

          curl -L --fail --retry 3 \
            "https://datahub.io/core/atp-world-tour-tennis-data/_r/-/csv/2_match_scores/match_scores_2017_UNINDEXED.csv" \
            -o data/public/datahub-atp/match_scores_2017.csv

          curl -L --fail --retry 3 \
            "https://datahub.io/core/atp-world-tour-tennis-data/_r/-/csv/3_match_stats/match_stats_1991-2016_UNINDEXED.csv" \
            -o data/public/datahub-atp/match_stats_1991-2016.csv

          curl -L --fail --retry 3 \
            "https://datahub.io/core/atp-world-tour-tennis-data/_r/-/csv/3_match_stats/match_stats_2017_UNINDEXED.csv" \
            -o data/public/datahub-atp/match_stats_2017.csv

          test -s data/public/datahub-atp/match_stats_1991-2016.csv
          test -s data/public/datahub-atp/match_scores_1991-2016.csv

      - name: Record provenance and hard limits
        run: |
          cat > data/public/datahub-atp/SOURCE.md <<'EOF'
          # DataHub ATP World Tour tennis data

          Source: https://datahub.io/core/atp-world-tour-tennis-data
          Upstream project: https://github.com/serve-and-volley/atp-world-tour-tennis-data
          License: Creative Commons Attribution 4.0 International (CC BY 4.0), as stated by DataHub.

          Included here:
          - ATP match scores 1991-2017
          - ATP detailed match statistics 1991-2017

          Supported raw fields include aces, double faults, first serves, first/second serve points won, break points saved/faced, service points, return points, return-game totals, service-game totals, and total points.

          IMPORTANT LIMIT: this source ends in 2017. It may be used only as genuinely historical evidence. It must not be represented as current 2026 serve/return form, and it must not fill a metric when the audited player has no supported pre-match observations in these files.
          EOF
          date -u +'%Y-%m-%dT%H:%M:%SZ' > data/public/datahub-atp/LAST_SYNC_UTC.txt

      - name: Commit data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public/datahub-atp
          if git diff --cached --quiet; then
            echo "No DataHub ATP changes."
            exit 0
          fi
          git commit -m "Sync CC BY ATP serve-return history"
          git push origin HEAD:main
