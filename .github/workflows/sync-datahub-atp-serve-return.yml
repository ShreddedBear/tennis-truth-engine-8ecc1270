name: Sync DataHub ATP Serve Return Data

on:
  workflow_dispatch:
  schedule:
    - cron: "43 6 * * 1"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download CC BY 4.0 ATP match stats and scores
        run: |
          set -euo pipefail
          rm -rf data/public/datahub-atp
          mkdir -p data/public/datahub-atp
          curl -L --fail --retry 3 "https://datahub.io/core/atp-world-tour-tennis-data/_r/-/csv/2_match_scores/match_scores_1991-2016_UNINDEXED.csv" -o data/public/datahub-atp/match_scores_1991-2016.csv
          curl -L --fail --retry 3 "https://datahub.io/core/atp-world-tour-tennis-data/_r/-/csv/2_match_scores/match_scores_2017_UNINDEXED.csv" -o data/public/datahub-atp/match_scores_2017.csv
          curl -L --fail --retry 3 "https://datahub.io/core/atp-world-tour-tennis-data/_r/-/csv/3_match_stats/match_stats_1991-2016_UNINDEXED.csv" -o data/public/datahub-atp/match_stats_1991-2016.csv
          curl -L --fail --retry 3 "https://datahub.io/core/atp-world-tour-tennis-data/_r/-/csv/3_match_stats/match_stats_2017_UNINDEXED.csv" -o data/public/datahub-atp/match_stats_2017.csv
          test -s data/public/datahub-atp/match_stats_1991-2016.csv
          test -s data/public/datahub-atp/match_scores_1991-2016.csv
      - name: Record provenance and freshness
        run: |
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '%s\n' "$NOW" > data/public/datahub-atp/LAST_SYNC_UTC.txt
          cat > data/public/datahub-atp/FRESHNESS.json <<EOF
          {"source":"DataHub ATP World Tour tennis data (CC BY 4.0)","last_sync_utc":"$NOW","data_through":"2017-12-31","mode":"ARCHIVAL","current_days":0,"stale_days":0}
          EOF
          cat > data/public/datahub-atp/SOURCE.md <<'EOF'
          # DataHub ATP World Tour tennis data
          Source: https://datahub.io/core/atp-world-tour-tennis-data
          Upstream: https://github.com/serve-and-volley/atp-world-tour-tennis-data
          License: CC BY 4.0.
          Included: ATP scores and detailed statistics 1991-2017.
          IMPORTANT: this is an ARCHIVAL source ending in 2017. Refreshing the files does not make the observations current. It may support historical/reconstructed evidence only and must never be represented as current player form.
          EOF
      - name: Commit data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public/datahub-atp
          if git diff --cached --quiet; then echo "No DataHub ATP changes."; exit 0; fi
          git commit -m "Sync CC BY ATP serve-return history"
          git push origin HEAD:main
