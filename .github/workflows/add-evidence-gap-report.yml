name: Add Evidence Gap Report
on:
  push:
    paths:
      - '.github/workflows/add-evidence-gap-report.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire evidence gap report into match workspace
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/routes/app/match.$matchId.tsx')
          s=p.read_text()
          imp='import { EvidenceGapReport } from "@/components/EvidenceGapReport";\n'
          anchor='import { AuditColorBadge, BucketBadge, StateText } from "@/components/StatusBadge";\n'
          if imp not in s:
              if anchor not in s: raise SystemExit('import anchor not found')
              s=s.replace(anchor,anchor+imp)
          target='''      <section className="panel space-y-4 p-4">\n        <div>\n          <h2 className="font-semibold">Detailed audit results · current run {run.run_number}</h2>'''
          replacement='''      <EvidenceGapReport metrics={metricRows} player1={match.player1_name} player2={match.player2_name} />\n\n      <section className="panel space-y-4 p-4">\n        <div>\n          <h2 className="font-semibold">Detailed audit results · current run {run.run_number}</h2>'''
          if '<EvidenceGapReport metrics={metricRows}' not in s:
              if target not in s: raise SystemExit('render anchor not found')
              s=s.replace(target,replacement)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'src/routes/app/match.$matchId.tsx'
          git diff --cached --quiet && exit 0
          git commit -m "Show metric-aware evidence gap report"
          git push
