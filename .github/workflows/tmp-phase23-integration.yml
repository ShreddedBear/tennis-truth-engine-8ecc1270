name: Temporary Phase 23 Integration

on:
  push:
    branches: [repair/evidence-coverage-phase23-integration]
    paths: ['.github/workflows/tmp-phase23-integration.yml']

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply provenance visibility patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/lib/evidence-coverage-runtime-diagnostic.server.ts')
          s=p.read_text()
          old='metric_code,player_name,opponent_name,treatment,evidence_family")'
          new='metric_code,player_name,opponent_name,treatment,evidence_family,sources,reliability,sample_label")'
          if old not in s: raise SystemExit('stored evidence select anchor not found')
          s=s.replace(old,new,1)
          old2='stored_p1:Boolean(p1Stored),stored_p2:Boolean(p2Stored),p1_treatment:'
          new2='stored_p1:Boolean(p1Stored),stored_p2:Boolean(p2Stored),stored_p1_family:p1Stored?.evidence_family??null,stored_p2_family:p2Stored?.evidence_family??null,stored_p1_source_count:Array.isArray(p1Stored?.sources)?p1Stored.sources.length:0,stored_p2_source_count:Array.isArray(p2Stored?.sources)?p2Stored.sources.length:0,stored_p1_reliability:p1Stored?.reliability??null,stored_p2_reliability:p2Stored?.reliability??null,stored_p1_has_sample:Boolean(p1Stored?.sample_label),stored_p2_has_sample:Boolean(p2Stored?.sample_label),p1_treatment:'
          if old2 not in s: raise SystemExit('diagnostic details anchor not found')
          p.write_text(s.replace(old2,new2,1))

          t=Path('src/lib/evidence-coverage-runtime-diagnostic.test.ts')
          ts=t.read_text()
          marker='  it("bounds runtime diagnostic database concurrency", () => {'
          block='''  it("surfaces persisted evidence provenance for coverage validation", () => {\n    expect(diagnostic).toContain('evidence_family,sources,reliability,sample_label');\n    expect(diagnostic).toContain('stored_p1_family:p1Stored?.evidence_family??null');\n    expect(diagnostic).toContain('stored_p2_family:p2Stored?.evidence_family??null');\n    expect(diagnostic).toContain('stored_p1_source_count:Array.isArray(p1Stored?.sources)?p1Stored.sources.length:0');\n    expect(diagnostic).toContain('stored_p2_source_count:Array.isArray(p2Stored?.sources)?p2Stored.sources.length:0');\n  });\n\n'''
          if block.strip() not in ts:
              if marker not in ts: raise SystemExit('test marker not found')
              t.write_text(ts.replace(marker,block+marker,1))
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Targeted Evidence Coverage tests
        run: bunx vitest run src/lib/evidence-coverage-runtime-diagnostic.test.ts
      - name: Full regression suite
        run: bunx vitest run
      - name: Production build
        run: bun run build
      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/evidence-coverage-runtime-diagnostic.server.ts src/lib/evidence-coverage-runtime-diagnostic.test.ts
          git commit -m 'Expose persisted Evidence Coverage provenance on current main'
          git push
