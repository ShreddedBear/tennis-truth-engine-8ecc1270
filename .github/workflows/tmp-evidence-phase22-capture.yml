name: Temporary Evidence Coverage Phase 22 Capture

on:
  push:
    branches: [diagnostic/evidence-coverage-phase22]
    paths: ['.github/workflows/tmp-evidence-phase22-capture.yml']

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Capture Phase 23 ingestion-missing metrics
        shell: bash
        run: |
          set -euo pipefail
          url='https://tennis-truth-engine.lovable.app/api/evidence-coverage-diagnostic?key=ECOV-20260825-b6f1'
          code=$(curl -sS -L --max-time 180 -o /tmp/ecov.json -w '%{http_code}' "$url")
          test "$code" = "200"
          mkdir -p diagnostics
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ecov.json'))
          r=d.get('report') or d.get('result') or d.get('data') or d.get('diagnostic') or d
          out={'schema_version':r.get('schema_version'),'generated_at':r.get('generated_at'),'matches':[]}
          for m in r.get('matches',[]):
              rows=[]
              for x in m.get('metrics',[]):
                  if x.get('failure_bucket')!='INGESTION_MISSING': continue
                  rows.append({'code':x.get('metric_code'),'name':x.get('metric_name'),'expected':x.get('source_expected'),'warehouse_observation_count':x.get('warehouse_observation_count'),'reason':x.get('reason')})
              out['matches'].append({'id':m.get('id'),'pair':m.get('pair'),'rows':rows})
          json.dump(out,open('diagnostics/evidence-coverage-phase23-ingestion-missing.json','w'),indent=2,sort_keys=True)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/evidence-coverage-phase23-ingestion-missing.json
          git commit -m 'Record Phase 23 ingestion-missing metrics'
          git push
