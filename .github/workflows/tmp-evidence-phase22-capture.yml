name: Temporary Evidence Coverage Verified Index Inspect

on:
  push:
    branches: [diagnostic/evidence-coverage-phase22]
    paths: ['.github/workflows/tmp-evidence-phase22-capture.yml']

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Extract exact verified index rows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          python - <<'PY'
          import json
          specs=[
            ('ATP_MAIN','data/audit/bsd-atp-main-pbp-history/2026/results.json',43148),
            ('WTA_MAIN','data/audit/bsd-wta-main-pbp-history/2026/results.json',43309),
            ('ATP_CHALLENGER','data/audit/bsd-atp-challenger-pbp-history/2026/results.json',31912),
          ]
          out={}
          for cls,path,mid in specs:
            rows=json.load(open(path))
            row=next((r for r in rows if str(r.get('match_id'))==str(mid)),None)
            out[cls]=row
          json.dump(out,open('diagnostics/evidence-coverage-phase24-index-rows.json','w'),indent=2,sort_keys=True)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/evidence-coverage-phase24-index-rows.json
          git commit -m 'Record verified index representative row details'
          git push
