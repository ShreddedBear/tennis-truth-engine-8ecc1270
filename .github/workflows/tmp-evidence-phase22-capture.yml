name: Temporary Evidence Coverage Phase 24 Capture

on:
  push:
    branches: [diagnostic/evidence-coverage-phase22]
    paths: ['.github/workflows/tmp-evidence-phase22-capture.yml']

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Capture published Phase 24 diagnostic
        shell: bash
        run: |
          set -euo pipefail
          url='https://tennis-truth-engine.lovable.app/api/evidence-coverage-diagnostic?key=ECOV-20260825-b6f1'
          code=$(curl -sS -L --max-time 180 -o /tmp/ecov.json -w '%{http_code}' "$url")
          test "$code" = "200"
          mkdir -p diagnostics
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ecov.json'))
          r=d.get('report') or d.get('result') or d.get('data') or d.get('diagnostic') or d
          out={'schema_version':r.get('schema_version'),'generated_at':r.get('generated_at'),'sampling':r.get('sampling'),'matches':[]}
          for m in r.get('matches',[]):
              missing=[]
              credited=[]
              for x in m.get('metrics',[]):
                  row={'code':x.get('metric_code'),'name':x.get('metric_name'),'bucket':x.get('failure_bucket'),'expected':x.get('source_expected'),'warehouse_observation_count':x.get('warehouse_observation_count'),'reason':x.get('reason'),'p1':x.get('p1_treatment'),'p2':x.get('p2_treatment'),'pair_credited':x.get('pair_credited'),'source_p1':x.get('credited_source_p1'),'source_p2':x.get('credited_source_p2')}
                  if x.get('pair_credited'): credited.append(row)
                  elif x.get('failure_bucket'): missing.append(row)
              out['matches'].append({'id':m.get('id'),'pair':m.get('pair'),'sampling_source':m.get('sampling_source'),'date_source':m.get('date_source'),'coverage':m.get('coverage'),'false_green_guard':m.get('false_green_guard'),'failure_buckets':m.get('failure_buckets'),'credited':credited,'missing':missing})
          json.dump(out,open('diagnostics/evidence-coverage-phase24-production.json','w'),indent=2,sort_keys=True)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/evidence-coverage-phase24-production.json
          git commit -m 'Record published Phase 24 Evidence Coverage diagnostic'
          git push
