name: Temporary Evidence Coverage Pair Intersection

on:
  push:
    branches: [diagnostic/evidence-coverage-phase22]
    paths: ['.github/workflows/tmp-evidence-phase22-capture.yml']

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Find persisted high-coverage pairs in verified indexes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          python - <<'PY'
          import json,glob,os
          wanted={
            tuple(sorted(x)) for x in [
              ('Flavio Cobolli','Arthur Fils'),
              ('Frances Tiafoe','Brandon Nakashima'),
              ('Jessica Pegula','Iga Swiatek'),
              ('Coco Gauff','Sara Bejlek'),
            ]
          }
          out=[]
          for path in glob.glob('data/audit/bsd-*-pbp-history/*/results.json'):
            try: rows=json.load(open(path))
            except Exception: continue
            for r in rows:
              ps=r.get('players') or []
              if len(ps)<2: continue
              key=tuple(sorted((str(ps[0]),str(ps[1]))))
              if key in wanted and r.get('structurally_present') is True:
                out.append({'path':path,**r})
          json.dump(out,open('diagnostics/evidence-coverage-pair-index-intersection.json','w'),indent=2,sort_keys=True)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/evidence-coverage-pair-index-intersection.json
          git commit -m 'Record high-coverage pair index intersection'
          git push
