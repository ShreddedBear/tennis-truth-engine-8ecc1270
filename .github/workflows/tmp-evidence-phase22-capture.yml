name: Temporary Evidence Coverage Phase 24 Summary

on:
  push:
    branches: [diagnostic/evidence-coverage-phase22]
    paths: ['.github/workflows/tmp-evidence-phase22-capture.yml']

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Summarize published Phase 24 diagnostic
        shell: bash
        run: |
          set -euo pipefail
          url='https://tennis-truth-engine.lovable.app/api/evidence-coverage-diagnostic?key=ECOV-20260825-b6f1'
          code=$(curl -sS -L --max-time 180 -o /tmp/ecov.json -w '%{http_code}' "$url")
          test "$code" = "200"
          mkdir -p diagnostics
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ecov.json'))
          r=d.get('report') or d.get('result') or d.get('data') or d.get('diagnostic') or d
          out={'schema_version':r.get('schema_version'),'generated_at':r.get('generated_at'),'sampling':r.get('sampling'),'matches':[]}
          for m in r.get('matches',[]):
              ing=[]; credit=[]; q=[]; norm=[]; wire=[]; recon=[]
              for x in m.get('metrics',[]):
                  b=x.get('failure_bucket'); code=x.get('metric_code')
                  if b=='INGESTION_MISSING': ing.append(code)
                  elif b=='COVERAGE_CREDIT_FAILURE': credit.append(code)
                  elif b=='EVIDENCE_QUERY_FAILURE': q.append(code)
                  elif b=='NORMALIZATION_FAILURE': norm.append(code)
                  elif b=='EVIDENCE_WIRING_FAILURE': wire.append(code)
                  elif b=='RECONSTRUCTION_FAILURE': recon.append(code)
              out['matches'].append({'id':m.get('id'),'pair':m.get('pair'),'sampling_source':m.get('sampling_source'),'date_source':m.get('date_source'),'coverage':m.get('coverage'),'false_green_guard':m.get('false_green_guard'),'failure_buckets':m.get('failure_buckets'),'ingestion_missing_codes':ing,'coverage_credit_codes':credit,'query_failure_codes':q,'normalization_failure_codes':norm,'wiring_failure_codes':wire,'reconstruction_failure_codes':recon})
          json.dump(out,open('diagnostics/evidence-coverage-phase24-summary.json','w'),indent=2,sort_keys=True)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/evidence-coverage-phase24-summary.json
          git commit -m 'Record Phase 24 production class summary'
          git push
