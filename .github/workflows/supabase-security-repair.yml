name: Supabase Security Repair Proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20260826103000_supabase_security_rls_repair.sql'
      - 'supabase/security/verify_security.sql'
      - 'src/lib/supabase-security-migration.test.ts'
      - '.github/workflows/supabase-security-repair.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260826103000_supabase_security_rls_repair.sql'
      - 'supabase/security/verify_security.sql'
      - 'src/lib/supabase-security-migration.test.ts'
      - '.github/workflows/supabase-security-repair.yml'

permissions:
  contents: read

jobs:
  static-security:
    name: Static security and regression guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Security migration tests
        run: bunx vitest run src/lib/supabase-security-migration.test.ts
      - name: Full regression suite
        run: bunx vitest run
      - name: Application build
        run: bun run build

  production-proof:
    name: Production migration, advisor and Evidence Coverage proof
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      ECOV_URL: https://tennis-truth-engine.lovable.app/api/evidence-coverage-diagnostic?key=ECOV-20260825-b6f1
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Require production credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret: $name"
              exit 1
            fi
          done
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Capture pre-repair Evidence Coverage baseline
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS --max-time 90 "$ECOV_URL" > ecov-before-envelope.json
          jq '.report // .' ecov-before-envelope.json > ecov-before.json
          jq -e '.metrics == 81 and ((.matches // [])|length) == 4 and all(.matches[]; .false_green_guard.passed == true)' ecov-before.json >/dev/null
          jq -r '.availability_accounting | "BEFORE_RETRIEVED=\(.retrieved_percent)%|SOFTWARE_LOSS=\(.software_loss_percent)%|GENUINE_UNAVAILABLE=\(.genuine_source_unavailability_percent)%|MAX_CEILING=\(.maximum_recoverable_ceiling_percent)%"' ecov-before.json
          jq -S '{metrics,sampling,availability_accounting,matches:[.matches[]|{id,coverage,availability_accounting,false_green_guard}]}' ecov-before.json > ecov-before-normalized.json

      - name: Capture pre-repair database security inventory
        shell: bash
        run: |
          set -euo pipefail
          supabase db query --linked --agent yes -o json '
            select json_build_object(
              ''public_rls_disabled'', (select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname=''public'' and c.relkind in (''r'',''p'') and not c.relrowsecurity),
              ''source_observations'', (select count(*) from public.source_observations),
              ''metric_evidence_store'', (select count(*) from public.metric_evidence_store),
              ''ingestion_targets'', (select count(*) from public.ingestion_targets),
              ''source_ingestion_runs'', (select count(*) from public.source_ingestion_runs)
            ) as baseline;' | tee db-before.json
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/advisors/security" > security-advisors-before.json
          cat security-advisors-before.json

      - name: Preview security migration
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Apply security migration
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Verify migration history
        run: supabase migration list

      - name: Run database linter
        run: supabase db lint --linked --schema public --level warning --fail-on error

      - name: Run strict live security assertions
        shell: bash
        run: |
          set -euo pipefail
          supabase db query --linked --agent yes -o json -f supabase/security/verify_security.sql | tee security-proof.json

      - name: Rerun hosted Supabase Security Advisor
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/advisors/security" > security-advisors-after.json
          cat security-advisors-after.json
          if jq -r '.. | objects | .name? // empty' security-advisors-after.json | \
            grep -Eiq 'rls_disabled_in_public|anon_security_definer_function_executable|authenticated_security_definer_function_executable'; then
            echo 'Target Supabase security advisor findings remain after migration.'
            exit 1
          fi

      - name: Prove Evidence Coverage unchanged and false-green firewall intact
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          ready=0
          for attempt in $(seq 1 30); do
            if curl -LfsS --max-time 90 "$ECOV_URL" > "$response"; then
              jq '.report // .' "$response" > ecov-after.json
              if jq -e '.metrics == 81 and ((.matches // [])|length) == 4 and all(.matches[]; .false_green_guard.passed == true)' ecov-after.json >/dev/null 2>&1; then
                ready=1
                break
              fi
            fi
            sleep 20
          done
          [ "$ready" = 1 ]
          jq -S '{metrics,sampling,availability_accounting,matches:[.matches[]|{id,coverage,availability_accounting,false_green_guard}]}' ecov-after.json > ecov-after-normalized.json
          diff -u ecov-before-normalized.json ecov-after-normalized.json
          jq -r '.availability_accounting | "AFTER_RETRIEVED=\(.retrieved_percent)%|SOFTWARE_LOSS=\(.software_loss_percent)%|GENUINE_UNAVAILABLE=\(.genuine_source_unavailability_percent)%|MAX_CEILING=\(.maximum_recoverable_ceiling_percent)%"' ecov-after.json
          echo 'PASS: Evidence Coverage production proof is identical before/after the security migration and false-green guards remain true.'

      - name: Upload security proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-security-repair-proof
          path: |
            db-before.json
            security-advisors-before.json
            security-advisors-after.json
            security-proof.json
            ecov-before.json
            ecov-after.json
            ecov-before-normalized.json
            ecov-after-normalized.json
          if-no-files-found: ignore
