name: Evidence Coverage Production Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/evidence-coverage-production-proof.yml'
      - 'src/routes/api/evidence-coverage-diagnostic.ts'
      - 'src/lib/evidence-coverage-runtime-diagnostic.server.ts'
      - 'src/lib/warehouse-first-researcher.server.ts'
      - 'src/lib/source-observation-metric-bridge.server.ts'
      - 'src/lib/metric-source-family-policy.ts'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for production diagnostic and prove sampling/firewalls
        shell: bash
        env:
          URL: https://tennis-truth-engine.lovable.app/api/evidence-coverage-diagnostic?key=ECOV-20260825-b6f1
        run: |
          set -euo pipefail
          response="$(mktemp)"
          report="$(mktemp)"
          status=""
          structurally_ready='def sampled($id): (.sampling.sampled_classes // []) | index($id) != null;
            def missing_with_reason($id):
              ((.sampling.missing_classes // []) | index($id) != null)
              and (((.sampling.missing_class_reasons // {})[$id] // "") | length > 0);
            .metrics == 81
            and sampled("ATP_MAIN")
            and sampled("WTA_MAIN")
            and (sampled("ATP_CHALLENGER") or missing_with_reason("ATP_CHALLENGER"))'
          for attempt in $(seq 1 30); do
            status="$(curl -L -sS -o "$response" -w '%{http_code}' --max-time 60 "$URL" || true)"
            if [ "$status" = "200" ] && jq -e 'if has("report") then .ok == true and (.report | type == "object") else type == "object" end' "$response" >/dev/null 2>&1; then
              jq '.report // .' "$response" > "$report"
              if jq -e "$structurally_ready" "$report" >/dev/null 2>&1; then
                break
              fi
            fi
            echo "Production diagnostic not ready (attempt=$attempt status=$status); retrying..."
            sleep 20
          done
          echo "HTTP status: $status"
          cat "$response"
          echo
          [ "$status" = "200" ]
          jq -e 'if has("report") then .ok == true and (.report | type == "object") else type == "object" end' "$response" >/dev/null
          jq '.report // .' "$response" > "$report"
          jq -e "$structurally_ready" "$report" >/dev/null
          jq -r '.sampling | "SAMPLED=" + ((.sampled_classes // [])|join(",")) + "|MISSING=" + ((.missing_classes // [])|join(",")) + "|MISSING_REASONS=" + ((.missing_class_reasons // {})|tojson)' "$report"
          jq -r '.matches[] | "\(.id): P1=\(.coverage.p1_percent)% P2=\(.coverage.p2_percent)% PAIR=\(.coverage.pair_percent)% one_sided=\(.coverage.one_sided) false_green_count=\(.false_green_guard.false_green_metric_count // 0) false_green_pass=\(.false_green_guard.passed) buckets=\(.failure_buckets|tojson)"' "$report"
          jq -e 'all(.matches[]; .false_green_guard.passed == true and ((.false_green_guard.false_green_metric_count // 0) == 0))' "$report" >/dev/null
          echo 'PASS: production diagnostic has valid representative sampling or explicit missing-class proof, and no one-sided evidence was credited as pair-complete.'
