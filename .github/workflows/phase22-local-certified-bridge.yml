name: Phase 22 local certified evidence bridge
on:
  push:
    branches: [repair/evidence-coverage-phase22-local-certified-bridge]
    paths: ['.github/workflows/phase22-local-certified-bridge.yml']
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/evidence-coverage-phase22-local-certified-bridge
          fetch-depth: 0
      - name: Export local provider-independent metric rows and wire them into diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          h=Path('src/lib/hybrid-audit-research.server.ts')
          s=h.read_text()
          old='function localMetricRows(p1:string,p2:string,context:string,requested:Array<{code:string;name:string;body:string|null}>):MetricFinding[]'
          new='export function localMetricRows(p1:string,p2:string,context:string,requested:Array<{code:string;name:string;body:string|null}>):MetricFinding[]'
          assert old in s or new in s
          if old in s: s=s.replace(old,new,1)
          h.write_text(s)

          p=Path('src/lib/evidence-coverage-runtime-diagnostic.server.ts')
          s=p.read_text()
          anchor='import { sampleVerifiedEvidenceIndexMatch } from "./evidence-index-match-sampler.server";'
          additions='''import { localMetricRows } from "./hybrid-audit-research.server";\nimport { enforceFiveMetricWiring } from "./completion-sweep-research.server";\nimport { certifyMetricFinding } from "./metric-certification";'''
          if 'localMetricRows' not in s:
            assert anchor in s
            s=s.replace(anchor,anchor+'\n'+additions,1)

          old='    const localByCode=await deterministicBatch(metrics,match),details:any[]=[];'
          new='''    const localByCode=await deterministicBatch(metrics,match);\n    const certifiedLocalRows=localMetricRows(match.p1,match.p2,match.context,metrics).map((row,index)=>certifyMetricFinding(enforceFiveMetricWiring(metrics[index],row)));\n    const certifiedLocalByCode=new Map(certifiedLocalRows.map(row=>[codeOf(row.metric_code),row]));\n    const details:any[]=[];'''
          assert old in s or 'const certifiedLocalRows=localMetricRows' in s
          if old in s: s=s.replace(old,new,1)

          old='local=localByCode.get(code)??{row:null,errors:[]};const p1Treatment=String(p1Stored?.treatment??local.row?.p1_treatment??"UNAVAILABLE"),p2Treatment=String(p2Stored?.treatment??local.row?.p2_treatment??"UNAVAILABLE")'
          new='local=localByCode.get(code)??{row:null,errors:[]},internal=certifiedLocalByCode.get(code)??null;const p1Treatment=String(p1Stored?.treatment??local.row?.p1_treatment??internal?.p1_treatment??"UNAVAILABLE"),p2Treatment=String(p2Stored?.treatment??local.row?.p2_treatment??internal?.p2_treatment??"UNAVAILABLE")'
          assert old in s or 'internal=certifiedLocalByCode.get(code)' in s
          if old in s: s=s.replace(old,new,1)

          old='deterministic_family:local.row?.evidence_family??null,failure_bucket:bucket,reason'
          new='deterministic_family:local.row?.evidence_family??internal?.evidence_family??null,local_internal_p1:Boolean(internal?.p1_value),local_internal_p2:Boolean(internal?.p2_value),failure_bucket:bucket,reason'
          assert old in s or 'local_internal_p1' in s
          if old in s: s=s.replace(old,new,1)

          s=s.replace('return {schema_version:8,generated_at:', 'return {schema_version:9,generated_at:',1)
          s=s.replace('REAL_PERSISTED_MATCHES_WITH_WAREHOUSE_OR_PERSISTED_PAIR_FALLBACK','REAL_PERSISTED_MATCHES_WITH_WAREHOUSE_PERSISTED_PAIR_VERIFIED_INDEX_AND_CERTIFIED_LOCAL_FALLBACK')
          p.write_text(s)

          t=Path('src/lib/evidence-coverage-runtime-diagnostic.test.ts')
          ts=t.read_text()
          block='''\n\ndescribe("certified provider-independent local evidence bridge", () => {\n  it("runs local historical evidence through the existing exact-field and certification guards before coverage credit", () => {\n    expect(diagnostic).toContain('localMetricRows(match.p1,match.p2,match.context,metrics)');\n    expect(diagnostic).toContain('certifyMetricFinding(enforceFiveMetricWiring(metrics[index],row))');\n    expect(diagnostic).toContain('internal=certifiedLocalByCode.get(code)??null');\n    expect(diagnostic).toContain('local_internal_p1:Boolean(internal?.p1_value)');\n    expect(diagnostic).toContain('schema_version:9');\n  });\n});\n'''
          if 'certified provider-independent local evidence bridge' not in ts: t.write_text(ts+block)
          PY
      - name: Install and run focused + local evidence tests
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://bun.sh/install | bash
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
          bunx vitest run src/lib/evidence-coverage-runtime-diagnostic.test.ts src/lib/postfix-wiring-007-011.test.ts src/lib/trusted-internal-evidence.test.ts
      - name: Type/build validation
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          bun run build
      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/hybrid-audit-research.server.ts src/lib/evidence-coverage-runtime-diagnostic.server.ts src/lib/evidence-coverage-runtime-diagnostic.test.ts
          git commit -m 'Bridge certified local evidence into coverage diagnostic'
          git push origin HEAD:repair/evidence-coverage-phase22-local-certified-bridge
